/* ------------------------------- HELPERS --------------------------------- */
function uidShort() { return Math.random().toString(36).slice(2, 8); }

function normalizePhone(v) {
  if (!v) return "";
  let d = v.replace(/[^\d+]/g, "");
  if (d.startsWith("+27")) d = "27" + d.slice(3);
  else if (d.startsWith("0")) d = "27" + d.slice(1);
  else if (d.startsWith("27")) { /* fine */ }
  return d;
}
function isValidSAPhone(v) {
  const d = normalizePhone(v);
  return /^27\d{9}$/.test(d);
}
function isValidEmail(v) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v); }

function fmtText(s) {
  const t = String(s == null ? "" : s).replace(/\r\n?/g, "\n").trim();
  if (!t) return "";
  return t.split(/\n{2,}/).map(p => `<p class="rt">${escapeHtml(p).replace(/\n/g, "<br>")}</p>`).join("");
}
function escapeHtml(s) {
  if (s === undefined || s === null) return "";
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function money(v) {
  if (v === undefined || v === null || v === "") return "";
  const n = Number(v);
  if (isNaN(n)) return escapeHtml(v);
  return "R" + n.toLocaleString("en-ZA");
}
function fmtDate(ts) {
  const d = new Date(ts);
  return d.toLocaleDateString("en-ZA", { day: "2-digit", month: "short", year: "numeric" }) + " · " + d.toLocaleTimeString("en-ZA", { hour: "2-digit", minute: "2-digit" });
}
function fieldVal(id) { return state.data[id] !== undefined ? state.data[id] : ""; }
function slug(s) { return String(s).toLowerCase().replace(/[^a-z0-9]+/g, ""); }

function showToast(msg) {
  const existing = document.querySelector(".toast");
  if (existing) existing.remove();
  const t = document.createElement("div");
  t.className = "toast";
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3200);
}

/* Reusable numbered process/journey visual — used in the Buy/Sell info
   modals, the Spotters Network page, and anywhere else a step-by-step
   flow needs to be shown. */
function renderProcessSteps(steps) {
  return `<div class="process-steps">
    ${steps.map((s, i) => `<div class="process-step">
      <div class="process-num">${i + 1}</div>
      <div class="process-label">${escapeHtml(s)}</div>
    </div>`).join("")}
  </div>`;
}
/* "Where's my request right now" tracker — shown right after submission.
   Small, honest touch (no fake stats): it only ever shows real state
   (submitted, then under review), reassuring the customer their request
   actually went somewhere instead of vanishing into a form. */
function renderJourneyTracker(currentIndex, steps) {
  return `<div class="journey-track">
    ${steps.map((s, i) => {
      const state_ = i < currentIndex ? "done" : i === currentIndex ? "current" : "future";
      return `<div class="journey-item ${state_}">
        <div class="journey-dot">${state_ === "done" ? "✓" : i + 1}</div>
        <div class="journey-label">${escapeHtml(s)}</div>
      </div>`;
    }).join(`<div class="journey-line"></div>`)}
  </div>`;
}

/* ============================== FIELD ENGINE =============================
   Field def: { id, label, type, required, options, placeholder, help,
                showIf(data), maxItems, watch(bool) }
   type: text | tel | email | number | textarea | select | radio | photos | heading | consent
=========================================================================== */

function fieldVisible(f) { return !f.showIf || f.showIf(state.data); }

function renderField(f) {
  if (f.type === "heading") {
    return `<div class="section-heading">${escapeHtml(f.label)}</div>`;
  }
  const val = fieldVal(f.id);
  const reqTag = f.required ? `<span class="req">required</span>` : `<span class="opt">optional</span>`;
  let control = "";
  if (f.type === "password") {
    control = `<div style="position:relative;"><input class="ctrl" type="password" id="f_${f.id}" data-fid="${f.id}" placeholder="${escapeHtml(f.placeholder || "")}" value="${escapeHtml(val)}" style="padding-right:50px;"><button type="button" class="pw-toggle" data-pwtoggle="f_${f.id}" style="position:absolute;right:4px;top:4px;bottom:4px;background:none;border:none;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--primary-teal);padding:0 10px;">Show</button></div>`;
  } else if (f.type === "text" || f.type === "tel" || f.type === "email" || f.type === "number") {
    control = `<input class="ctrl" type="${f.type}" id="f_${f.id}" data-fid="${f.id}" placeholder="${escapeHtml(f.placeholder || "")}" value="${escapeHtml(val)}">`;
  } else if (f.type === "textarea") {
    control = `<textarea class="ctrl" id="f_${f.id}" data-fid="${f.id}" placeholder="${escapeHtml(f.placeholder || "")}">${escapeHtml(val)}</textarea>`;
  } else if (f.type === "select") {
    control = `<select class="ctrl" id="f_${f.id}" data-fid="${f.id}"><option value="">Choose…</option>` +
      f.options.map(o => `<option value="${escapeHtml(o)}" ${val === o ? "selected" : ""}>${escapeHtml(o)}</option>`).join("") +
      `</select>`;
  } else if (f.type === "radio") {
    control = `<div class="radio-row" data-fid="${f.id}">` +
      f.options.map(o => `<button type="button" class="chip" data-role="chip" data-fid="${f.id}" data-val="${escapeHtml(o)}">${escapeHtml(o)}</button>`).join("") +
      `</div>`;
  } else if (f.type === "photos") {
    const items = Array.isArray(val) ? val : [];
    control = `<div class="photo-grid" data-fid="${f.id}">` +
      items.map((p, i) => `<div class="photo-thumb">${p.isImage ? `<img src="${p.dataUrl}">` : `<div style="display:flex;align-items:center;justify-content:center;height:100%;font-size:11px;color:var(--muted);padding:4px;text-align:center;">${escapeHtml(p.name)}</div>`}<button class="rm" data-role="rmphoto" data-fid="${f.id}" data-idx="${i}">✕</button></div>`).join("") +
      (items.length < (f.maxItems || CONFIG.MAX_PHOTOS) ? `<label class="photo-add">${f.capture ? "📷" : "+"}<input type="file" accept="image/*${f.capture ? "" : ",.pdf"}" ${f.capture ? `capture="${f.capture}"` : "multiple"} data-role="photoinput" data-fid="${f.id}"></label>` : "") +
      `</div><div class="help">${items.length}/${f.maxItems || CONFIG.MAX_PHOTOS} uploaded · images are compressed for storage</div>`;
  } else if (f.type === "consent") {
    control = `<label style="display:flex;gap:10px;align-items:flex-start;cursor:pointer;">
      <input type="checkbox" data-role="consent" data-fid="${f.id}" ${val ? "checked" : ""} style="margin-top:3px;">
      <span style="font-size:13px;color:var(--muted);line-height:1.5;">${f.label}</span>
    </label>`;
    return `<div class="field" data-fieldwrap="${f.id}">${control}<div class="err" data-errfor="${f.id}" style="display:none;"></div></div>`;
  }
  return `<div class="field" data-fieldwrap="${f.id}">
    <label>${escapeHtml(f.label)} ${reqTag}</label>
    ${control}
    ${f.help ? `<div class="help">${escapeHtml(f.help)}</div>` : ""}
    <div class="err" data-errfor="${f.id}" style="display:none;"></div>
  </div>`;
}

function markChipSelections(container) {
  container.querySelectorAll('[data-role="chip"]').forEach(btn => {
    const fid = btn.getAttribute("data-fid");
    const v = btn.getAttribute("data-val");
    btn.classList.toggle("on", fieldVal(fid) === v);
  });
}

function readVisibleFieldsIntoState(fields) {
  fields.forEach(f => {
    if (f.type === "heading" || f.type === "photos") return;
    const el = document.getElementById(`f_${f.id}`);
    if (el) state.data[f.id] = el.value;
  });
}

function compressImageFile(file) {
  return new Promise((resolve) => {
    if (!file.type.startsWith("image/")) {
      // Non-image (e.g. PDF) — store a lightweight reference only, not the bytes,
      // to stay well within storage size limits for this demo.
      resolve({ name: file.name, isImage: false, dataUrl: null, note: "file not embedded in this demo — collect via a real upload service in production" });
      return;
    }
    const img = new Image();
    const reader = new FileReader();
    reader.onload = (e) => {
      img.onload = () => {
        const maxDim = CONFIG.MAX_PHOTO_DIM;
        let { width, height } = img;
        if (width > height && width > maxDim) { height = Math.round(height * (maxDim / width)); width = maxDim; }
        else if (height > maxDim) { width = Math.round(width * (maxDim / height)); height = maxDim; }
        const canvas = document.createElement("canvas");
        canvas.width = width; canvas.height = height;
        canvas.getContext("2d").drawImage(img, 0, 0, width, height);
        const dataUrl = canvas.toDataURL("image/jpeg", CONFIG.PHOTO_QUALITY);
        resolve({ name: file.name, isImage: true, dataUrl });
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function validateStep(fields) {
  let ok = true;
  document.querySelectorAll(".err").forEach(e => { e.style.display = "none"; e.textContent = ""; });
  document.querySelectorAll(".field").forEach(e => e.classList.remove("has-err"));
  fields.forEach(f => {
    if (!fieldVisible(f)) return;
    if (f.type === "heading") return;
    const v = state.data[f.id];
    let msg = "";
    if (f.type === "consent") {
      if (f.required && !v) msg = "Please confirm this to continue.";
    } else if (f.type === "photos") {
      if (f.required && (!Array.isArray(v) || v.length === 0)) msg = "Please add at least one photo.";
    } else {
      const empty = v === undefined || v === null || String(v).trim() === "";
      if (f.required && empty) msg = "This field is required.";
      else if (!empty && f.type === "email" && !isValidEmail(v)) msg = "Enter a valid email address.";
      else if (!empty && f.type === "tel" && !isValidSAPhone(v)) msg = "Enter a valid South African number, e.g. 075 491 0677 or +27 75 491 0677.";
      else if (!empty && f.type === "number" && isNaN(Number(v))) msg = "Enter a number.";
    }
    if (msg) {
      ok = false;
      const wrap = document.querySelector(`[data-fieldwrap="${f.id}"]`);
      if (wrap) wrap.classList.add("has-err");
      const errEl = document.querySelector(`[data-errfor="${f.id}"]`);
      if (errEl) { errEl.style.display = "block"; errEl.textContent = msg; }
    }
  });
  return ok;
}

function attachFieldListeners(container, onAnyChange) {
  container.querySelectorAll("[data-fid]").forEach(el => {
    if (el.matches("input,select,textarea") && !el.hasAttribute("data-role")) {
      const fid = el.getAttribute("data-fid");
      if (el.tagName === "SELECT") {
        // Selects drive conditional field visibility, so a real re-render is needed.
        el.addEventListener("change", () => { state.data[fid] = el.value; onAnyChange(); });
      } else {
        // Text/email/tel/number/textarea: update state silently on every
        // keystroke, but deliberately do NOT re-render on "change" here —
        // that event also fires on blur (e.g. clicking into the next
        // field), and re-rendering then would rebuild the very field the
        // person just clicked into, kicking their focus/typing out mid-flow.
        el.addEventListener("input", () => { state.data[fid] = el.value; });
      }
    }
  });
  container.querySelectorAll('[data-role="chip"]').forEach(btn => {
    btn.addEventListener("click", () => {
      const fid = btn.getAttribute("data-fid");
      const val = btn.getAttribute("data-val");
      state.data[fid] = (state.data[fid] === val) ? "" : val;
      onAnyChange();
    });
  });
  container.querySelectorAll('[data-role="consent"]').forEach(el => {
    el.addEventListener("change", () => { state.data[el.getAttribute("data-fid")] = el.checked; });
  });
  container.querySelectorAll('[data-role="photoinput"]').forEach(el => {
    el.addEventListener("change", async (e) => {
      const fid = el.getAttribute("data-fid");
      const files = Array.from(e.target.files || []);
      if (!files.length) return;
      const cur = Array.isArray(state.data[fid]) ? state.data[fid] : [];
      const room = (CONFIG.MAX_PHOTOS) - cur.length;
      const use = files.slice(0, Math.max(0, room));
      showToast("Processing photos…");
      const compressed = await Promise.all(use.map(compressImageFile));
      state.data[fid] = cur.concat(compressed);
      onAnyChange();
    });
  });
  container.querySelectorAll('[data-role="rmphoto"]').forEach(btn => {
    btn.addEventListener("click", () => {
      const fid = btn.getAttribute("data-fid");
      const idx = Number(btn.getAttribute("data-idx"));
      const cur = Array.isArray(state.data[fid]) ? state.data[fid].slice() : [];
      cur.splice(idx, 1);
      state.data[fid] = cur;
      onAnyChange();
    });
  });
}

function getCustomerName(d, key) {
  if (key === "buy" || key === "sell" || key === "sell_auction") return `${d.title ? d.title + " " : ""}${d.firstName || ""} ${d.surname || ""}`.trim();
  if (key === "contract") return d.name || "";
  return d.fullName || "";
}
// "Mr Anderson" style — used specifically in the WhatsApp message text so
// AutoMarketer can tell people apart at a glance, per Amo's preference.
function formalName(d) {
  return `${d.title || ""} ${d.surname || ""}`.trim() || d.firstName || "the customer";
}
function getLocation(d, key) {
  if (key === "buy" || key === "sell" || key === "sell_auction" || key === "insurance") return [d.city, d.province].filter(Boolean).join(", ");
  if (key === "contract") return [d.location, d.province].filter(Boolean).join(", ");
  return d.location || d.clientLocation || d.sLocation || "";
}
function leadTypeLabel(key) {
  return { buy: "Vehicle Buyer", sell: "Vehicle Seller", sell_auction: "Dream Rides Auction", insurance: "Insurance", spotter: "Spotter Network", contract: "Truck / Contract", other: "Other Service" }[key] || key;
}
function prefillName(key) {

function buildWhatsAppText(lead) {
  const d = lead.data || {};
  const who = formalName(d);
  if (lead.type === "buy") {
    const vehicle = [d.make, d.model].filter(Boolean).join(" ");
    const wantLine = vehicle ? `I'm looking for a ${vehicle}.` : (d.description ? `I'm looking for a car I can use for ${d.description}.` : "I'm looking for a vehicle.");
    const bodyLines = [
      `Hi, my name is ${who}.`,
      wantLine,
      d.maxPrice ? `My budget is ${money(d.maxPrice)}.` : "",
      d.additionalRequirements || "",
      lead.location ? `I'm based in ${lead.location}.` : "",
      `My number is ${lead.whatsappDisplay || "-"}.`
    ].filter(Boolean);
    return bodyLines.join("\n");
  }
  if (lead.type === "sell") {
    const vehicle = [d.year, d.make, d.model].filter(Boolean).join(" ") || "a vehicle";
    const bodyLines = [
      `Hi, my name is ${who}.`,
      `I have a ${vehicle} that I would like to sell.`,
      d.mileage ? `Mileage: ${d.mileage}` : "",
      d.exteriorCondition ? `Condition: ${d.exteriorCondition}` : "",
      d.askingPrice ? `Asking Price: ${money(d.askingPrice)}` : "",
      lead.location ? `Location: ${lead.location}` : "",
      `Contact number: ${lead.whatsappDisplay || "-"}`
    ].filter(Boolean);
    if (d.additionalNotes) bodyLines.push("", "Additional information:", d.additionalNotes);
    return bodyLines.join("\n");
  }
  if (lead.type === "sell_auction") {
    const vehicle = [d.year, d.make, d.model].filter(Boolean).join(" ") || "a vehicle";
    const bodyLines = [
      `Hi, my name is ${who}.`,
      `I'd like to sell my ${vehicle} through Dream Rides.`,
      d.mileage ? `Mileage: ${d.mileage}` : "",
      d.exteriorCondition ? `Condition: ${d.exteriorCondition}` : "",
      d.askingPrice ? `Asking Price: ${money(d.askingPrice)}` : "",
      lead.location ? `Location: ${lead.location}` : "",
      `Contact number: ${lead.whatsappDisplay || "-"}`
    ].filter(Boolean);
    if (d.additionalNotes) bodyLines.push("", "Additional information:", d.additionalNotes);
    return bodyLines.join("\n");
  }
  if (lead.type === "spotter" && d.submissionType === "Buyer") {
    const vehicle = [d.wantedMake, d.wantedModel].filter(Boolean).join(" ") || "a vehicle";
    const bodyLines = [
      `Hi, my name is ${lead.customerName || "-"}.`,
      "I have a client.",
      `Client name: ${d.clientName || "-"}`,
      `Client number: ${d.clientWhatsapp || "-"}`,
      `They are looking for a ${vehicle}.`,
      d.wantedBudget ? `Budget: ${money(d.wantedBudget)}` : "",
      d.buyerAdditional || "",
      `Spotter number: ${lead.whatsappDisplay || "-"}`
    ].filter(Boolean);
    return bodyLines.join("\n");
  }
  // Generic structured message for spotter seller referrals, insurance,
  // contracts, and the catch-all "other" type. The Lead ID intentionally
  // does NOT appear here — it's for the AutoMarketer admin dashboard only.
  const lines = [
    `AUTOMARKETER ${lead.type === "buy" ? "BUYER" : lead.type.toUpperCase()} LEAD`,
    "",
    "Customer Details",
    `Name: ${lead.customerName || "-"}`,
    `WhatsApp: ${lead.whatsappDisplay || "-"}`,
    `Location: ${lead.location || "-"}`,
    "",
    "Summary",
    lead.summary || "-",
    "",
    `Source: ${lead.source}`
  ];
  return lines.join("\n");
}

/* Maps each flow's free-form field IDs onto a stable, CRM-ready schema —
   the shape a real `leads` table in Supabase would use. Kept alongside the
   existing lead fields so nothing already reading `lead.data` breaks. */
function buildNormalizedRecord(key, data, ctx) {
  const iso = new Date(ctx.createdAt).toISOString();
  const rec = {
    id: ctx.id, lead_type: key, submitted_at: iso,
    name: ctx.name || null, phone: ctx.phone || null, email: data.email || null,
    client_name: null, client_phone: null,
    vehicle_make: null, vehicle_model: null, vehicle_year: null, mileage: null, transmission: null,
    budget: null, asking_price: null, location: ctx.location || null, vehicle_condition: null,
    description: null, uploaded_files: [],
    agreement_accepted: !!data.agreementAccepted,
    agreement_version: data.agreementAccepted ? CONFIG.AGREEMENTS.version : null,
    consent_status: data.consent ? "given" : "not_given",
    // Real delivery status requires a server-side WhatsApp Business Cloud API
    // call — see the chat notes. "pending" here just means "not yet sent by
    // a backend"; the customer's own click-to-chat button still works today.
    whatsapp_notification_status: "pending",
    whatsapp_message_id: null, notification_error: null,
    created_at: iso, updated_at: iso
  };
  Object.keys(data).forEach(k => {
    const v = data[k];
    if (Array.isArray(v) && v.length && v[0] && typeof v[0] === "object" && "isImage" in v[0]) {
      v.forEach(p => rec.uploaded_files.push(p.name));
    }
  });
  if (key === "buy") {
    rec.vehicle_make = data.make || null; rec.vehicle_model = data.model || null; rec.vehicle_year = data.maxYear || data.minYear || null;
    rec.transmission = data.transmission || null; rec.budget = data.maxPrice || null;
    rec.description = data.description || data.additionalRequirements || null;
  } else if (key === "sell" || key === "sell_auction") {
    rec.vehicle_make = data.make || null; rec.vehicle_model = data.model || null; rec.vehicle_year = data.year || null;
    rec.mileage = data.mileage || null; rec.transmission = data.transmission || null; rec.asking_price = data.askingPrice || null;
    rec.vehicle_condition = data.exteriorCondition || data.interiorCondition || null; rec.description = data.additionalNotes || null;
    if (key === "sell_auction" && data.askingPrice) rec.description = `${rec.description || ""} [Reserve Price: ${money(Number(data.askingPrice) + CONFIG.AUCTION_ADMIN_FEE)}]`.trim();
  } else if (key === "spotter") {
    if (data.submissionType === "Buyer") {
      rec.client_name = data.clientName || null; rec.client_phone = data.clientWhatsapp || null;
      rec.vehicle_make = data.wantedMake || null; rec.vehicle_model = data.wantedModel || null; rec.budget = data.wantedBudget || null;
      rec.description = data.buyerAdditional || null;
    } else if (data.submissionType === "Seller") {
      rec.client_name = data.sClientName || null; rec.client_phone = data.sClientWhatsapp || null;
      rec.vehicle_make = data.sMake || null; rec.vehicle_model = data.sModel || null; rec.vehicle_year = data.sYear || null;
      rec.mileage = data.sMileage || null; rec.asking_price = data.sAskingPrice || null; rec.vehicle_condition = data.sCondition || null;
      rec.description = [data.sVin ? `VIN: ${data.sVin}` : "", data.sellerAdditional || ""].filter(Boolean).join(" · ") || null;
    } else {
      rec.description = data.otherDescription || null;
    }
  } else {
    rec.description = data.description || data.otherDescription2 || data.contractDescription || null;
  }
  return rec;
}

async function submitLead() {
  const agreement = CONFIG.AGREEMENTS[state.leadType];
  if (agreement && !state.data.agreementAccepted) { showToast(`Please accept the ${agreement.label} before submitting.`); return; }
  if (!state.data.consent) { showToast("Please confirm consent before submitting."); return; }
  const btn = document.querySelector('[data-role="submit-lead"]');
  if (btn) { btn.disabled = true; btn.textContent = "Submitting…"; }
  try {
    const key = state.leadType;
    const id = await nextLeadId(key);
    const phoneRaw = state.data.whatsapp || "";
    const phone = normalizePhone(phoneRaw);
    const name = getCustomerName(state.data, key);
    const location = getLocation(state.data, key);
    const flow = FLOWS[key];
    const createdAt = Date.now();

    const isDuplicate = false; // duplicate flags are computed on the admin screen now

    const record = buildNormalizedRecord(key, state.data, { id, createdAt, name, phone, location });
    const lead = {
      id, type: key, createdAt, source: state.source,
      status: "New", priority: "Normal", notes: [], isDuplicate, assignedTo: null,
      customerName: name || "-", whatsappDisplay: phoneRaw, email: state.data.email || "",
      location, summary: flow.summary(state.data), data: state.data,
      agreementAccepted: !!state.data.agreementAccepted, agreementVersion: record.agreement_version,
      spotterAccountId: (key === "spotter" && state.spotterAuth.session) ? state.spotterAuth.session.id : null,
      record // CRM/Supabase-ready normalized shape — see chat notes
    };
    // Save to Supabase: photos go into the PRIVATE lead-uploads bucket, then the
    // lead row is inserted. If either step fails we throw, so the customer sees
    // the "try again" message instead of a false success.
    const sb = getSupabase();
    const uploadedPaths = [];
    const dataForDb = {};
    let photoIdx = 0;
    for (const k of Object.keys(state.data)) {
      const v = state.data[k];
      if (Array.isArray(v) && v.length && v[0] && typeof v[0] === "object" && "isImage" in v[0]) {
        dataForDb[k] = [];
        for (const p of v) {
          const entry = { name: p.name, isImage: !!p.isImage };
          const m = (p.isImage && p.dataUrl) ? /^data:([^;]+);base64,(.*)$/.exec(p.dataUrl) : null;
          if (m) {
            const bytes = Uint8Array.from(atob(m[2]), c => c.charCodeAt(0));
            const path = `${id}/${photoIdx++}-${p.name}`;
            const { error: upErr } = await sb.storage.from("lead-uploads").upload(path, bytes, { contentType: m[1] });
            if (upErr) throw new Error("Photo upload failed: " + upErr.message);
            entry.path = path; uploadedPaths.push(path);
          }
          dataForDb[k].push(entry);
        }
      } else dataForDb[k] = v;
    }
    const { error: dbErr } = await sb.from("leads").insert({
      id, lead_type: record.lead_type,
      name: record.name ?? null, phone: record.phone ?? null, email: record.email ?? null, location: record.location ?? null,
      client_name: record.client_name ?? null, client_phone: record.client_phone ?? null,
      spotter_account_id: lead.spotterAccountId || null,
      vehicle_make: record.vehicle_make ?? null, vehicle_model: record.vehicle_model ?? null,
      vehicle_year: toNum(record.vehicle_year, true), mileage: toNum(record.mileage, true),
      transmission: record.transmission ?? null, vehicle_condition: record.vehicle_condition ?? null,
      budget: toNum(record.budget), asking_price: toNum(record.asking_price),
      description: record.description ?? null, uploaded_files: uploadedPaths,
      agreement_accepted: !!record.agreement_accepted, agreement_version: record.agreement_version ?? null,
      consent_status: record.consent_status, source: lead.source,
      raw_data: { data: dataForDb, summary: lead.summary, customerName: lead.customerName, whatsappDisplay: phoneRaw }
    });
    if (dbErr) throw new Error("Could not save lead: " + dbErr.message);
    await logEvent("lead_submitted", { type: key, id });

    if (window.Notification) {
      if (Notification.permission === "granted") new Notification("New AutoMarketer lead", { body: `${id} — ${name || "New lead"}` });
      else if (Notification.permission !== "denied") Notification.requestPermission();
    }
    state.lastLead = lead;
    state.screen = "confirm";
    render();
  } catch (e) {
    console.error(e);
    if (btn) { btn.disabled = false; btn.textContent = "Submit Request"; }
    showToast("We couldn't submit your request. Check your connection and try again.");
  }
}

function visibleStepIdx(flow) {
  return flow.steps.map((s, i) => i).filter(i => flow.steps[i].fields.filter(fieldVisible).some(f => f.type !== "heading"));
}
function stepProgress() {
  const flow = FLOWS[state.leadType];
  const vis = visibleStepIdx(flow);
  return { pos: vis.indexOf(state.stepIndex) + 1, total: vis.length };
}
function screenForm() {
  const flow = FLOWS[state.leadType];

function bindForm() {

  markChipSelections(container);
  attachFieldListeners(container, () => render());
  document.querySelector('[data-role="stepback"]').addEventListener("click", goPrevStep);
  document.querySelector('[data-role="stepnext"]').addEventListener("click", goNextStep);

function goNextStep() {
  const flow = FLOWS[state.leadType];
  const step = flow.steps[state.stepIndex];
  const visFields = step.fields.filter(fieldVisible);
  readVisibleFieldsIntoState(visFields);
  if (!validateStep(visFields)) return;
  let idx = state.stepIndex + 1;
  while (idx < flow.steps.length) {
    if (flow.steps[idx].fields.filter(fieldVisible).some(f => f.type !== "heading")) break;
    idx++;
  }
  if (idx >= flow.steps.length) { state.screen = "review"; render(); return; }
  state.stepIndex = idx; render();
}
function goPrevStep() {
  const flow = FLOWS[state.leadType];
  if (state.screen === "review") {
    let idx = flow.steps.length - 1;
    while (idx >= 0 && !flow.steps[idx].fields.filter(fieldVisible).some(f => f.type !== "heading")) idx--;
    state.stepIndex = Math.max(idx, 0); state.screen = "form"; render(); return;
  }
  let idx = state.stepIndex - 1;
  while (idx >= 0 && !flow.steps[idx].fields.filter(fieldVisible).some(f => f.type !== "heading")) idx--;
  if (idx < 0) {
    if (state.leadType === "sell_auction") { state.screen = "dreamrides"; }
    else if (["insurance", "spotter", "contract", "other"].includes(state.leadType)) { state.screen = "other-services"; }
    else { state.screen = "services"; }
    render(); return;
  }
  state.stepIndex = idx; render();
}

      if (f.type === "photos") {
        const n = Array.isArray(v) ? v.length : 0;
        return n ? `<div class="review-row"><span class="k">${escapeHtml(f.label)}</span><span class="v">${n} photo${n === 1 ? "" : "s"}</span></div>` : "";
      }
      if (v === undefined || v === null || String(v).trim() === "") return "";
      const isMoney = /price|budget|income|value|settlement|premium|rate|excess/i.test(f.id) && f.type === "number";
      return `<div class="review-row"><span class="k">${escapeHtml(f.label)}</span><span class="v">${escapeHtml(isMoney ? money(v) : v)}</span></div>`;
    }).join("");
    return rows ? `<div class="review-section"><h4>${escapeHtml(step.title)}</h4>${rows}</div>` : "";
  }).join("");

  const agreement = CONFIG.AGREEMENTS[state.leadType]; // set for buy / sell / sell_auction / spotter

  return `

    <div class="consent-box">
      <input type="checkbox" id="rv_consent" ${state.data.consent ? "checked" : ""}>
      <p>I consent to AutoMarketer contacting me about this request and sharing the relevant details with appropriate third parties (e.g. a dealership, lender, or partner) solely to provide the service I've asked for. See our <a href="#" id="rv_privacy">Privacy Policy</a>.</p>
    </div>
    ${["buy", "sell", "sell_auction"].includes(state.leadType) ? `<p class="help" style="margin-top:10px;">AutoMarketer acts as a broker and intermediary — see our <a href="#" id="rv_disclaimer">Brokerage Disclaimer</a> for how this connection works.</p>` : ""}
    <div class="btn-row">

    <div id="stepFields">${fields.map(renderField).join("")}</div>

    </p>

function bindSpotterAuth() {
  bindTopbarBack(() => { state.screen = "spotters"; render(); });
  const container = document.getElementById("stepFields");
  attachFieldListeners(container, () => render());
  document.querySelectorAll('[data-role="switchview"]').forEach(a => a.addEventListener("click", (e) => {
    e.preventDefault(); state.data = {}; state.spotterAuth.error = "";
    state.spotterAuth.view = state.spotterAuth.view === "login" ? "register" : "login";
    render();
  }));
  document.querySelector('[data-role="authsubmit"]').addEventListener("click", async () => {
    const isLogin = state.spotterAuth.view === "login";
    const fields = isLogin ? SPOTTER_LOGIN_FIELDS : SPOTTER_REGISTER_FIELDS;
    readVisibleFieldsIntoState(fields);
    if (!validateStep(fields)) return;
    const btn = document.querySelector('[data-role="authsubmit"]');
    btn.disabled = true; btn.textContent = "Please wait…";
    if (isLogin) {
      const result = await loginSpotter(state.data.loginEmail, state.data.loginPassword);
      if (!result.ok) { state.spotterAuth.error = result.error; btn.disabled = false; btn.textContent = "Log in"; render(); return; }
      await setSpotterSession(result.account);
      state.data = {}; state.screen = "spotter-dashboard"; render();
    } else {
      if (state.data.password !== state.data.confirmPassword) {
        state.spotterAuth.error = "Passwords don't match."; btn.disabled = false; btn.textContent = "Create account"; render(); return;
      }
      if (state.data.password.length < 6) {
        state.spotterAuth.error = "Password must be at least 6 characters."; btn.disabled = false; btn.textContent = "Create account"; render(); return;
      }
      const result = await registerSpotter(state.data);
      if (!result.ok) { state.spotterAuth.error = result.error; btn.disabled = false; btn.textContent = "Create account"; render(); return; }
      await setSpotterSession(result.account);
      await logEvent("spotter_registered");
      state.data = {}; state.screen = "spotter-dashboard"; render();
    }
  });
}

async function dnBitmap(file) {

  catch (e) {

async function dnScaled(file, maxDim, quality) {
  const bm = await dnBitmap(file);
  let w = bm.width || bm.naturalWidth, h = bm.height || bm.naturalHeight;
  const k = Math.min(1, maxDim / Math.max(w, h));
  w = Math.max(1, Math.round(w * k)); h = Math.max(1, Math.round(h * k));
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  c.getContext("2d").drawImage(bm, 0, 0, w, h);

}

/* The AutoMarketer "studio wallpaper": soft wall, teal-tinted floor, faint logo, teal base strip. */
async function dnDrawWallpaper(ctx, W, H) {
  const horizon = H * 0.66;
  let g = ctx.createLinearGradient(0, 0, 0, horizon);
  g.addColorStop(0, "#F7FAFB"); g.addColorStop(1, "#DCEAED");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, horizon);
  g = ctx.createLinearGradient(0, horizon, 0, H);
  g.addColorStop(0, "#CFE1E5"); g.addColorStop(1, "#A9C8CE");
  ctx.fillStyle = g; ctx.fillRect(0, horizon, W, H - horizon);
  ctx.fillStyle = "rgba(255,255,255,.55)"; ctx.fillRect(0, horizon - 1, W, 2);
  const rg = ctx.createRadialGradient(W / 2, horizon * 0.8, 20, W / 2, horizon * 0.8, W * 0.55);
  rg.addColorStop(0, "rgba(255,255,255,.75)"); rg.addColorStop(1, "rgba(255,255,255,0)");
  ctx.fillStyle = rg; ctx.fillRect(0, 0, W, horizon);
  const logo = await dnLogo();
  if (logo) {
    const lw = W * 0.46, lh = lw * (logo.height / logo.width);
    ctx.globalAlpha = 0.07; ctx.drawImage(logo, (W - lw) / 2, horizon * 0.5 - lh / 2, lw, lh);
    const sw = 120, sh = sw * (logo.height / logo.width);
    ctx.globalAlpha = 0.92; ctx.drawImage(logo, 22, H - sh - 24, sw, sh);
    ctx.globalAlpha = 1;
  }
  ctx.fillStyle = "rgba(0,78,92,.75)"; ctx.font = "600 20px 'Space Grotesk', system-ui, sans-serif"; ctx.textAlign = "right";
  ctx.fillText(CONFIG.DOMAIN, W - 24, H - 30);
  ctx.fillStyle = "#00687A"; ctx.fillRect(0, H - 8, W, 8);
}
/* Crop the cut-out to the car, scale it to fit, add a soft shadow, and place it on the wallpaper. */
async function dnCompose(cutoutBlob) {
  const bm = await createImageBitmap(cutoutBlob);
  const s = Math.min(1, 480 / Math.max(bm.width, bm.height));
  const tw = Math.max(1, Math.round(bm.width * s)), th = Math.max(1, Math.round(bm.height * s));
  const probe = document.createElement("canvas"); probe.width = tw; probe.height = th;
  const pctx = probe.getContext("2d", { willReadFrequently: true }); pctx.drawImage(bm, 0, 0, tw, th);
  const d = pctx.getImageData(0, 0, tw, th).data;
  let minX = tw, minY = th, maxX = -1, maxY = -1;
  for (let y = 0; y < th; y++) for (let x = 0; x < tw; x++) {
    if (d[(y * tw + x) * 4 + 3] > 24) { if (x < minX) minX = x; if (x > maxX) maxX = x; if (y < minY) minY = y; if (y > maxY) maxY = y; }
  }
  if (maxX < minX || maxY < minY) throw new Error("No car found in the picture");
  const sx = Math.max(0, Math.floor(minX / s)), sy = Math.max(0, Math.floor(minY / s));
  const sw = Math.min(bm.width - sx, Math.ceil((maxX - minX + 1) / s)), sh = Math.min(bm.height - sy, Math.ceil((maxY - minY + 1) / s));
  const W = 1280, H = 960;
  const out = document.createElement("canvas"); out.width = W; out.height = H;
  const ctx = out.getContext("2d");
  await dnDrawWallpaper(ctx, W, H);
  const k = Math.min((W * 0.84) / sw, (H * 0.58) / sh);
  const dw = sw * k, dh = sh * k, baseY = H * 0.80, dx = (W - dw) / 2, dy = baseY - dh;
  ctx.save(); ctx.translate(W / 2, baseY - dh * 0.015); ctx.scale(1, 0.13);
  const sg = ctx.createRadialGradient(0, 0, 0, 0, 0, dw * 0.52);
  sg.addColorStop(0, "rgba(0,40,50,.42)"); sg.addColorStop(1, "rgba(0,40,50,0)");
  ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(0, 0, dw * 0.52, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  ctx.drawImage(bm, sx, sy, sw, sh, dx, dy, dw, dh);
  return dnCanvasBlob(out, "image/jpeg", 0.86);
}

// The tool is a big download the first time (the model). We start it the moment a car is started and
// run one tiny test picture through it, so the model is really loaded before the first real photo.
async function dnBgRemover() {
  if (window.AM_BG_REMOVER) return window.AM_BG_REMOVER;   // optional override hook (e.g. a server-side remover later)
  if (_dnBgFn) return _dnBgFn;
  if (_dnBgLoading) return _dnBgLoading;
  _dnBgLoading = (async () => {
    let lastErr = null;
    const urls = DN.BG_LIB_URLS.slice(_dnUrlShift % DN.BG_LIB_URLS.length).concat(DN.BG_LIB_URLS.slice(0, _dnUrlShift % DN.BG_LIB_URLS.length));
    for (const url of urls) {
      try {
        const m = await import(url);
        const fn = m.removeBackground || (m.default && m.default.removeBackground) || (typeof m.default === "function" ? m.default : null);
        if (typeof fn !== "function") continue;
        const cfg = (extra) => Object.assign({ model: DN.BG_MODEL, output: { format: "image/png", quality: 0.9 },
          progress: (key, cur, tot) => { if (tot > 0 && String(key).indexOf("fetch") === 0) dnBgSet("loading", Math.min(99, Math.round(cur / tot * 100))); } }, extra || {});
        dnBgSet("loading", 1);
        const warm = await new Promise((res) => { const c = document.createElement("canvas"); c.width = c.height = 64; const x = c.getContext("2d"); x.fillStyle = "#888"; x.fillRect(0, 0, 64, 64); c.toBlob(res, "image/png"); });
        await fn(warm, cfg());                                   // loads the model for real; throws if the download fails
        _dnBgFn = (blob) => fn(blob, cfg({ progress: undefined }));
        dnBgSet("ready", 100); return _dnBgFn;
      } catch (e) { lastErr = e; console.warn("Background tool address failed", url, e); }
    }
    throw lastErr || new Error("The background remover could not be loaded");

    const { data: si, error: siErr } = await sb.auth.signInWithPassword({ email, password: d.password });
    if (siErr) return { ok: false, error: "An account with this email already exists. Please log in instead." };
    const { data: existing } = await sb.from("dealers").select("id").maybeSingle();
    if (existing) return { ok: false, error: "This email is already registered as a dealer. Please log in." };
    user = si.user;

    id: user.id, dealership_name: d.dealershipName.trim(), contact_person: d.contactPerson.trim(), phone: d.phone.trim(), email,
    province: d.province, city: d.city.trim(), address: (d.address || "").trim() || null, reg_number: (d.regNumber || "").trim() || null,
    dream_rides_account: d.drAccount || "none", dream_rides_username: (d.drUsername || "").trim() || null,

   NUMBER PLATES ARE BLURRED
   Every outside photo (front, sides, back, boot, engine, extras) opens this screen first. The Spotter drags a
   box over each number plate and the plate is pixelated BEFORE anything else happens to the picture, so the
   blurred picture is the only one that is ever used — on the Cars page and in the private original.
   (If a photo shows no plate, they say so with one tap.)

/* Replace a rectangle of the canvas with a coarse mosaic (about 4 x 2 blocks over a plate): unreadable. */
function dnPixelate(ctx, x, y, w, h) {
  const cw = ctx.canvas.width, ch = ctx.canvas.height;
  x = Math.max(0, Math.floor(x)); y = Math.max(0, Math.floor(y));
  w = Math.min(cw - x, Math.ceil(w)); h = Math.min(ch - y, Math.ceil(h));
  if (w < 2 || h < 2) return;
  const cell = Math.max(8, Math.round(Math.min(w, h) / 2.5));
  const tw = Math.max(1, Math.ceil(w / cell)), th = Math.max(1, Math.ceil(h / cell));
  const t = document.createElement("canvas"); t.width = tw; t.height = th;
  t.getContext("2d").drawImage(ctx.canvas, x, y, w, h, 0, 0, tw, th);
  ctx.save(); ctx.imageSmoothingEnabled = false; ctx.drawImage(t, 0, 0, tw, th, x, y, w, h); ctx.restore();
}

/* Resolves { blob, mode: "blurred" | "none" }, or null if the Spotter cancels (the photo is then not used). */
function dnOpenPlateEditor(blob, label) {
  return new Promise(async (resolve) => {
    let bm;
    try { bm = await dnBitmap(blob); } catch (e) { console.error(e); resolve(null); return; }
    const W = bm.width || bm.naturalWidth, H = bm.height || bm.naturalHeight;
    const wrap = document.createElement("div");
    wrap.className = "dn-plate"; wrap.setAttribute("role", "dialog"); wrap.setAttribute("aria-label", "Blur the number plate");
    wrap.innerHTML = `
      <div class="dn-plate-card">
        <h3>Blur the number plate${label ? ` <span>· ${escapeHtml(label)}</span>` : ""}</h3>
        <p class="dn-plate-help">Drag your finger over each <b>number plate</b> to cover it. Cover the whole plate. Add a box for every plate you can see.</p>
        <canvas class="dn-plate-cv" aria-label="Photo. Drag over the number plate to blur it."></canvas>
        <p class="dn-plate-count" data-plate-count>No plate covered yet</p>
        <div class="dn-plate-btns">
          <button type="button" class="btn btn-primary" data-plate="done" disabled>Done — plate blurred</button>
          <button type="button" class="btn btn-ghost" data-plate="undo" disabled>Undo last box</button>
          <button type="button" class="btn btn-ghost" data-plate="none">No number plate in this photo</button>
          <button type="button" class="btn btn-ghost" data-plate="cancel">Cancel — don't use this photo</button>
        </div>

    const prevOverflow = document.body.style.overflow; document.body.style.overflow = "hidden";
    const cv = wrap.querySelector("canvas"); cv.width = W; cv.height = H;
    const ctx = cv.getContext("2d"), boxes = []; let drag = null;
    const doneBtn = wrap.querySelector('[data-plate="done"]'), undoBtn = wrap.querySelector('[data-plate="undo"]'), countEl = wrap.querySelector("[data-plate-count]");
    const rectOf = (a, b) => ({ x: Math.min(a.x, b.x), y: Math.min(a.y, b.y), w: Math.abs(a.x - b.x), h: Math.abs(a.y - b.y) });

    const finish = (val) => { if (closed) return; closed = true; document.removeEventListener("keydown", onKey); document.body.style.overflow = prevOverflow; wrap.remove(); resolve(val); };

      const b = e.target.closest("[data-plate]"); if (!b || b.disabled) return;

    });

  });
}

function dnPaintCarGrid() {
  const C = state.cars, el = document.getElementById("cars_grid");
  if (!el) return;
  const soon = C.section === "dealer" && !DN.DEALERS_LIVE;
  document.querySelectorAll(".cars-tab").forEach(t => t.classList.toggle("on", t.getAttribute("data-sec") === C.section));
  const np = document.getElementById("cars_n_private"); if (np) np.textContent = C.loaded ? String(C.list.filter(c => c.seller_type === "private").length) : "";
  const nd = document.getElementById("cars_n_dealer"); if (nd) nd.textContent = C.loaded ? String(C.list.filter(c => c.seller_type === "dealer").length) : "";
  const main = document.getElementById("cars_main"), sp = document.getElementById("cars_soon");
  if (main) main.hidden = soon; if (sp) sp.hidden = !soon;
  if (soon) return;
  const list = dnFilteredCars(), inSec = C.list.filter(c => c.seller_type === C.section).length;

async function bindCar() {
  bindNav(); bindFooterLinks();
  document.querySelectorAll('[data-role="car_back"]').forEach(b => b.addEventListener("click", () => { state.screen = "cars"; render(); }));
  let c = dnCurrentCar();
  if (!c) {   // opened from a shared link (?car=REF)
    await dnLoadCars();
    c = dnCurrentCar();
    if (!c && state.cars.openRef) { const one = await dnFindCarByRef(state.cars.openRef); if (one) { state.cars.list.push(one); c = one; } }
    if (c) { state.cars.openId = c.id; state.cars.section = c.seller_type; render(); return; }
    const m = document.getElementById("car_missing"); if (m) m.textContent = "That car isn't available any more.";
    return;
  }
  const paintGallery = () => {
    const g = document.getElementById("car_gallery"); if (!g) return;
    g.innerHTML = dnGalleryHtml(c);
    g.querySelectorAll("[data-photo]").forEach(b => b.addEventListener("click", () => { state.cars.activePhoto = Number(b.getAttribute("data-photo")); paintGallery(); }));
  };
  paintGallery();
  if (!state.cars.photos[c.id]) { await dnLoadCarPhotos(c.id); if (state.cars.openId === c.id) paintGallery(); }
  if (dnApproved() && !state.cars.loaded) { await dnLoadCars(true); if (state.cars.openId === c.id) { render(); return; } }
  const f = document.getElementById("iq_fields");
  if (f) attachFieldListeners(f, () => render());
  const send = document.getElementById("iq_send");
  if (send) send.addEventListener("click", () => dnSubmitInquiry(c));
  const sf = document.getElementById("sp_iq_fields");
  if (sf) attachFieldListeners(sf, () => render());
  const spSend = document.getElementById("sp_iq_send");
  if (spSend) spSend.addEventListener("click", () => dnSubmitSpotterInquiry(c));
  const spCancel = document.getElementById("sp_iq_cancel");
  if (spCancel) spCancel.addEventListener("click", () => { state.cars.spotterFormFor = null; render(); });
  const another = document.getElementById("car_another");
  if (another) another.addEventListener("click", () => { state.cars.sentSp = null; state.cars.spotterFormFor = c.id; render(); });
  const manage = document.getElementById("car_manage");
  if (manage) manage.addEventListener("click", () => { state.spotterCars.tab = "cars"; state.screen = "spotter-dashboard"; render(); });
  const cl = document.getElementById("car_client");
  if (cl) cl.addEventListener("click", () => {
    if (c.seller_type === "private") { state.cars.spotterFormFor = c.id; render(); } else dnSpotterClientFlow(c);
  });
}
async function dnSubmitInquiry(c) {
  readVisibleFieldsIntoState(DN_INQ_FIELDS);
  if (!validateStep(DN_INQ_FIELDS)) return;
  const btn = document.getElementById("iq_send"); btn.disabled = true; btn.textContent = "Sending…";
  const d = state.data;
  const { error } = await getSupabase().from("vehicle_inquiries").insert({
    vehicle_id: c.id, name: d.iqName.trim(), phone: normalizePhone(d.iqPhone), email: (d.iqEmail || "").trim() || null,
    message: (d.iqMsg || "").trim() || null, preferred_contact: d.iqContact || "WhatsApp", consent: true, source: "client"
  });
  if (error) { console.error(error); btn.disabled = false; btn.textContent = "Send inquiry"; showToast("We couldn't send that. Please try again."); return; }
  logEvent("car_inquiry", { ref: c.ref });
  state.cars.sentFor = c.id; state.data = {}; render();
}
// A Spotter's client inquiry: goes to AutoMarketer, who forwards it to the Spotter who posted the car.
async function dnSubmitSpotterInquiry(c) {
  readVisibleFieldsIntoState(DN_SP_INQ_FIELDS);
  if (!validateStep(DN_SP_INQ_FIELDS)) return;
  const btn = document.getElementById("sp_iq_send"); btn.disabled = true; btn.textContent = "Sending…";
  const d = state.data;
  const { error } = await getSupabase().from("vehicle_inquiries").insert({
    vehicle_id: c.id, name: d.siName.trim(), phone: normalizePhone(d.siPhone), message: (d.siMsg || "").trim() || null,
    preferred_contact: "WhatsApp", consent: true, source: "spotter"
  });
  if (error) { console.error(error); btn.disabled = false; btn.textContent = "Send to AutoMarketer"; showToast("We couldn't send that. Please try again."); return; }
  logEvent("car_inquiry", { ref: c.ref, by: "spotter" });
  state.spotterCars.loaded = false;
  state.cars.sentSp = c.id; state.cars.spotterFormFor = null; state.data = {}; render();
}
// Dealer cars (when that network opens): a Spotter with a buyer goes into the existing Spotter lead form, pre-filled.
function dnSpotterClientFlow(c) {
  const s = state.spotterAuth.session; if (!s || !dnApproved()) return;
  startFlow("spotter");
  Object.assign(state.data, {
    fullName: s.fullName, whatsapp: s.whatsapp, email: s.email, existingSpotter: "Yes", submissionType: "Buyer",
    wantedMake: c.make, wantedModel: c.model, wantedYear: c.year, wantedBudget: c.price,
    buyerAdditional: `Buyer is interested in listed car ${c.ref}: ${dnCarTitle(c)} at ${dnSeller(c)} (${dnWhere(c)}), listed at ${money(c.price)}.`
  });
  render();
}

function bindDealerAuth() {
  bindTopbarBack(() => { state.screen = "dealers"; render(); });
  const container = document.getElementById("stepFields");
  const all = document.querySelector(".screen");
  attachFieldListeners(all, () => render());
  document.querySelectorAll('[data-role="switchview"]').forEach(a => a.addEventListener("click", (e) => {
    e.preventDefault(); state.data = {}; state.dealer.error = "";
    state.dealer.view = state.dealer.view === "login" ? "register" : "login"; render();
  }));
  const btn = document.querySelector('[data-role="authsubmit"]');
  const submit = async () => {
    const isLogin = state.dealer.view === "login";
    const fields = isLogin ? DN_LOGIN_FIELDS : DN_REG_FIELDS.concat([DN_AGREE_FIELD]);
    readVisibleFieldsIntoState(fields);
    if (!validateStep(fields)) return;
    const fail = (m) => { state.dealer.error = m; btn.disabled = false; btn.textContent = isLogin ? "Log in" : "Create dealer account"; render(); };
    btn.disabled = true; btn.textContent = "Please wait…";
    const d = state.data;
    let result;
    if (isLogin) result = await loginDealer(d.dlEmail, d.dlPass);
    else {
      if (d.password !== d.confirmPassword) return fail("Passwords don't match.");
      if (d.password.length < 6) return fail("Password must be at least 6 characters.");
      const dr = (DN.DR_ACCOUNT.find(a => a[1] === d.drAccount) || ["none"])[0];
      result = await registerDealer(Object.assign({}, d, { drAccount: dr }));
      if (result.ok) logEvent("dealer_registered");
    }
    if (!result.ok) return fail(result.error);
    state.dealer.session = dnDealerSession(result.account);
    state.dealer.loaded = false; state.dealer.tab = "cars"; state.dealer.error = "";
    state.data = {}; state.screen = "dealer-portal"; render();
  };
  btn.addEventListener("click", submit);
  const last = document.querySelector('input[type="password"]:last-of-type');
  document.querySelectorAll('input[type="password"]').forEach(p => p.addEventListener("keydown", (e) => { if (e.key === "Enter" && state.dealer.view === "login") submit(); }));
}

async function dnCarAction(btn) {
  const act = btn.getAttribute("data-dnact"), id = btn.getAttribute("data-id"), sb = getSupabase();
  const done = async (msg) => { await dnLoadDealerData(); showToast(msg); dnPaintPortalBody(); };
  if (act === "edit") { state.dealer.editId = id; dnPaintPortalBody(); return; }
  if (act === "canceledit") { state.dealer.editId = null; dnPaintPortalBody(); return; }
  if (act === "saveedit") {
    const price = Number(document.getElementById("ed_price").value), comm = Number(document.getElementById("ed_comm").value);
    if (!(price > 0) || !(comm >= 0)) { showToast("Enter a valid price and commission."); return; }
    const { error } = await sb.rpc("dealer_update_vehicle", { p_id: id, p_price: price, p_commission: comm });
    if (error) { showToast(error.message); return; }
    state.dealer.editId = null; return done("Updated");
  }
  if (act === "dr") {
    const { error } = await sb.rpc("dealer_request_dream_rides", { p_id: id });
    if (error) { showToast(error.message); return; }
    return done("Requested — AutoMarketer will be in touch about Dream Rides.");
  }
  if (act === "Sold" || act === "Withdrawn") {
    if (!confirm(act === "Sold" ? "Mark this car as sold? It will disappear from the website." : "Withdraw this car from the website?")) return;

        ${sp ? row("VIN (private)", String(d.cVin || "").replace(/\s/g, "").toUpperCase()) + row("Licence disc", A.disc ? "Photo added" : "") : ""}
        ${sl ? row("Your asking price", money(d.cPrice)) + row("Note to AutoMarketer", d.cNote) : row("Selling price (buyers see this)", money(d.cPrice))}${sl ? "" : sp ? row("Commission you offer (private)", money(d.cCommission)) + row("Note to AutoMarketer", d.cNote) : row("Your commission to AutoMarketer (private)", money(d.cCommission)) + row("Dream Rides", d.cDream ? "Requested" : "No")}</div>
      <div class="review-section"><h4>Photos (${shots.length})</h4>
        <div class="review-photos">${shots.map(s => `<div><img src="${A.shots[s.id].displayUrl}" alt=""></div>`).join("")}</div></div>
      ${A.progress ? `<div class="progress-note">${escapeHtml(A.progress)}</div>` : ""}`;
  }
  const last = A.step === STEPS.length - 1;
  const busy = A.submitting ? `<div class="dn-busy" role="alert"><div class="box"><div class="spinner"></div><b>Sending your car…</b><p id="dn_busy_msg">${escapeHtml(A.progress || "Please wait")}</p><small>Please keep this page open. This can take a minute on mobile data.</small></div></div>` : "";
  const topErr = A.error ? `<div class="err dn-top-err"><b>Your car was not sent.</b><br>${escapeHtml(A.error)}<br><small>Fix this or press the button again. If it keeps happening, send a screenshot of this message to AutoMarketer.</small></div>` : "";
  return `${topbar(sl ? "Sell your car" : sp ? "Post a car" : "Add a car", true)}${busy}<div class="screen">${topErr}${stepsBar}${body}
    <div class="btn-row">
      <button class="btn btn-ghost" data-role="dn_prev">${A.step === 0 ? "Cancel" : "Back"}</button>
      <button class="btn btn-primary" data-role="dn_next" ${A.submitting ? "disabled" : ""}>${last ? (A.submitting ? "Submitting…" : sl ? "Send my car to AutoMarketer" : sp ? "Submit for approval" : "Submit car") : "Next"}</button>
    </div></div>`;
}
function dnAddBack() {
  const A = state.dealerAdd;
  if (A.step === 0) {
    if (Object.keys(A.shots).length && !confirm("Leave without saving this car? Your photos will be lost.")) return;
    state.screen = dnAddKind() === "seller" ? "seller-intro" : dnAddKind() === "spotter" ? "spotter-dashboard" : "dealer-portal"; state.data = {}; render(); return;
  }
  { const k = dnStepKey(); if (k === "verify") readVisibleFieldsIntoState(DN_VERIFY_FIELDS); else if (k === "price") readVisibleFieldsIntoState(dnPriceFields()); }
  A.step--; A.error = ""; render();
}
async function dnAddNext() {
  const A = state.dealerAdd, key = dnStepKey();
  if (key === "details") {
    readVisibleFieldsIntoState(dnCarFields()); if (!validateStep(dnCarFields())) return;
    const y = Number(state.data.cYear); if (y < 1950 || y > new Date().getFullYear() + 1) { showToast("Enter a valid year."); return; }
    if (dnIsPriv() && String(state.data.cDesc || "").trim().length < 10) { showToast("Please describe the car in a sentence or two."); return; }
    A.step++; render(); return;
  }
  if (key === "photos") {
    const missing = DN.SLOTS.filter(s => s.req && !A.shots[s.id]);
    if (missing.length) { A.showMissing = true; dnPaintShots(); showToast(`Still needed: ${missing.map(s => s.label).join(", ")}`); return; }
    A.step++; render(); return;
  }
  if (key === "verify") {
    readVisibleFieldsIntoState(DN_VERIFY_FIELDS); if (!validateStep(DN_VERIFY_FIELDS)) return;
    const vin = String(state.data.cVin || "").replace(/\s/g, "").toUpperCase();
    if (!/^[A-Z0-9]{11,17}$/.test(vin)) { showToast("The VIN should be 11 to 17 letters and numbers, exactly as on the licence disc."); return; }
    state.data.cVin = vin;
    if (!A.disc) { A.showMissing = true; dnPaintDisc(); showToast("Please add a photo of the licence disc."); return; }
    A.step++; render(); return;
  }
  if (key === "price") { readVisibleFieldsIntoState(dnPriceFields()); if (!validateStep(dnPriceFields())) return; if (!(Number(state.data.cPrice) > 0)) { showToast("Enter the selling price."); return; }
    if (dnAddKind() === "seller" && !/^[0-9+() -]{9,20}$/.test(String(state.data.sPhone || "").trim())) { showToast("Enter your WhatsApp number, e.g. 082 123 4567."); return; } if (Number(state.data.cCommission) < 0) { showToast("Commission can't be negative."); return; } A.step++; render(); return; }
  return dnSubmitCar();
}
async function dnSubmitCar() {
  const A = state.dealerAdd, sb = getSupabase(), sl = dnAddKind() === "seller", sp = dnIsPriv(), d = state.data;
  const uid = sl ? state.seller.uid : sp ? state.spotterAuth.session.id : state.dealer.session.id;
  A.submitting = true; A.error = ""; A.progress = "Finishing the backgrounds…"; render(); window.scrollTo(0, 0);
  try {
    // Give background removal time to finish (showing how many are left); anything still busy falls back to the original photo.
    const t0 = Date.now();
    while (Object.values(A.shots).some(e => e.bg === "processing") && Date.now() - t0 < DN.BG_SUBMIT_WAIT_MS) {
      const left = Object.values(A.shots).filter(e => e.bg === "processing").length;
      dnShowProgress(`Finishing the backgrounds… ${left} photo${left === 1 ? "" : "s"} left` + (DN_BG.status === "loading" ? ` (tool loading ${DN_BG.pct}%)` : ""));
      await Promise.race([_dnQueue, _dnTick(1000)]);
    }
    Object.values(A.shots).forEach(e => { if (e.bg === "processing") { e.bg = "failed"; e.displayUrl = e.origUrl; e.display = e.orig; } });
    const slots = dnAllSlots().filter(s => A.shots[s.id]);
    const photos = []; let n = 0;
    for (const s of slots) {
      const e = A.shots[s.id]; n++;
      A.progress = `Uploading photo ${n} of ${slots.length}…`; dnShowProgress(A.progress);
      if (!e.path) {
        const rnd = Math.random().toString(36).slice(2, 8);
        const path = `${uid}/${A.id}/${s.id}-${rnd}.jpg`;
        const up = await sb.storage.from("vehicle-photos").upload(path, e.display, { contentType: "image/jpeg" });
        if (up.error) throw new Error("Photo upload failed: " + up.error.message);
        e.path = path;
        if (s.cutout && e.bg === "done") {
          const opath = `${uid}/${A.id}/${s.id}-${rnd}-original.jpg`;
          const uo = await sb.storage.from("vehicle-originals").upload(opath, e.orig, { contentType: "image/jpeg" });
          if (!uo.error) e.originalPath = opath;
        }
      }
      photos.push({ slot: s.id, path: e.path, original_path: e.originalPath || null, bg_status: s.cutout ? (e.bg === "done" ? "done" : "failed") : "skipped" });
    }
    if (sp) {
      A.progress = "Uploading the licence disc…"; dnShowProgress(A.progress);
      if (!A.disc.path) {
        const rnd = Math.random().toString(36).slice(2, 8), dpath = `${uid}/${A.id}/disc-${rnd}.jpg`;
        const ud = await sb.storage.from("vehicle-docs").upload(dpath, A.disc.blob, { contentType: "image/jpeg" });
        if (ud.error) throw new Error("Licence disc upload failed: " + ud.error.message);
        A.disc.path = dpath;
      }
    }
    A.progress = "Saving your car…"; dnShowProgress(A.progress);
    const base = {
      id: A.id, make: d.cMake, model: d.cModel, variant: d.cVariant || "", year: d.cYear, mileage: d.cMileage || "", price: d.cPrice,
      transmission: d.cTrans || "", fuel_type: d.cFuel || "", body_type: d.cBody || "", colour: d.cColour || "",
      province: d.cProvince || "", city: d.cCity || "", description: d.cDesc || "", features: d.cFeatures || "", photos
    };
    const { error } = sl
      ? await sb.rpc("submit_seller_car", { p: Object.assign(base, { seller_name: d.sName, seller_phone: String(d.sPhone || "").trim(), consent: !!d.cAuth, owner_note: d.cNote || "", vin: d.cVin, disc_path: A.disc.path }) })
      : sp
      ? await sb.rpc("submit_private_car", { p: Object.assign(base, { owner_offer: d.cCommission, owner_note: d.cNote || "", vin: d.cVin, disc_path: A.disc.path }) })
      : await sb.rpc("submit_vehicle", { p: Object.assign(base, { dealer_commission: d.cCommission, dream_rides: !!d.cDream }) });
    if (error) throw new Error(error.message);
    Object.values(A.shots).forEach(e => { try { URL.revokeObjectURL(e.origUrl); if (e.displayUrl !== e.origUrl) URL.revokeObjectURL(e.displayUrl); } catch (_) {} });
    if (A.disc) { try { URL.revokeObjectURL(A.disc.url); } catch (_) {} }
    state.dealerAdd = { kind: A.kind, step: 0, id: null, shots: {}, disc: null, submitting: false, error: "", progress: "" };
    if (sl) { dnSellerFinished(d); return; }
    state.data = {};
    if (sp) { state.spotterCars.loaded = false; state.spotterCars.tab = "cars"; state.cars.loaded = false; state.screen = "spotter-dashboard"; }
    else { state.dealer.loaded = false; state.dealer.tab = "cars"; state.screen = "dealer-portal"; }
    render();
    showToast("Car submitted — AutoMarketer will review it.");
  } catch (e) {
    console.error(e);
    let msg = e.message || "Something went wrong. Please try again.";
    if (/row-level security|policy|permission/i.test(msg)) msg += sl ? " — Technical note: the seller sign-in was refused. Staff: check Supabase → Authentication → “Allow anonymous sign-ins” is ON and update_03nov.sql was run." : await dnWhyDenied(uid, sp);
    A.submitting = false; A.progress = ""; A.error = msg; render(); window.scrollTo(0, 0);
    showToast("Your car was NOT sent. See the red message at the top.");
  }
}
// When the server refuses something, add a plain-language note about WHO it thinks you are (helps find the cause fast).
async function dnWhyDenied(uid, sp) {
  try {
    const sb = getSupabase(), { data } = await sb.auth.getUser(), u = data && data.user;
    if (!u) return " — Technical note: you are not logged in any more. Log in again.";
    const act = await sb.rpc(sp ? "is_active_spotter" : "is_dealer");
    return ` — Technical note: logged in as ${u.email}; matches this ${sp ? "Spotter" : "dealer"} account: ${u.id === uid ? "yes" : "NO — log out and log in again"}; active ${sp ? "Spotter" : "dealer"}: ${act && act.data === true ? "yes" : "NO — this login is not an active " + (sp ? "Spotter" : "dealer") + " account"}.`;
  } catch (_) { return ""; }
}
function dnShowProgress(msg) { const m = document.getElementById("dn_busy_msg"); if (m) m.textContent = msg; }
function bindDealerAdd() {
  const A = state.dealerAdd, sl = dnAddKind() === "seller", sp = dnIsPriv();
  if (sl && !state.seller.uid) return bindSellerIntro();
  if (!sl && dnAddKind() === "spotter" && state.spotterAuth.session && !dnApproved()) return bindSpotterDashboard();

  const discBox = document.querySelector("[data-disc]");

    discBox.parentElement.addEventListener("click", (e) => { const b = e.target.closest("[data-discact]"); if (b && state.dealerAdd.disc) { try { URL.revokeObjectURL(state.dealerAdd.disc.url); } catch (_) {} state.dealerAdd.disc = null; dnPaintDisc(); } });
  }
  const guide = document.querySelector(".photo-guide");

  const shots = document.getElementById("dn_shots");
  if (shots) {
    shots.addEventListener("change", (e) => { const inp = e.target.closest("[data-shotinput]"); if (inp && inp.files && inp.files[0]) dnHandleFile(inp.getAttribute("data-shotinput"), inp.files[0]); });
    document.getElementById("dn_retryall").addEventListener("click", (e) => { if (e.target.closest("[data-retryall]")) dnRetryAllFailed(); });
    shots.addEventListener("click", (e) => { const b = e.target.closest("[data-shotact]"); if (b) dnShotAction(b.getAttribute("data-shotact"), b.getAttribute("data-slot")); });
  }
}

async function dnLoadSpotterCars() {
  const sb = getSupabase(), S = state.spotterCars, uid = state.spotterAuth.session.id;
  const [cars, offers, finder, inq, msgs] = await Promise.all([
    sb.from("vehicles").select("*").eq("owner_spotter_id", uid).order("created_at", { ascending: false }),
    sb.from("vehicle_owner_terms").select("*"),
    sb.from("vehicle_spotter_terms").select("vehicle_id,spotter_commission"),
    sb.from("vehicle_inquiries").select("*, vehicles(ref,make,model,variant,year,seller_type)").order("created_at", { ascending: false }),
    sb.from("vehicle_messages").select("*").order("created_at", { ascending: true })
  ]);
  S.loadError = [["cars", cars], ["offers", offers], ["inquiries", inq], ["messages", msgs]].filter(([, r]) => r.error).map(([n, r]) => n + ": " + r.error.message).join(" · ");
  S.msgs = {}; (msgs.data || []).forEach(m => { (S.msgs[m.vehicle_id] = S.msgs[m.vehicle_id] || []).push(m); });
  S.cars = cars.data || [];
  S.offers = {}; (offers.data || []).forEach(o => { S.offers[o.vehicle_id] = o; });
  S.finder = {}; (finder.data || []).forEach(t => { S.finder[t.vehicle_id] = Number(t.spotter_commission); });
  const all = inq.data || [];
  S.received = all.filter(q => q.owner_spotter_id === uid);

function dnPaintSpotterPanels() {
  const S = state.spotterCars, cars = document.getElementById("sp_panel_cars"), inq = document.getElementById("sp_panel_inq");
  if (!cars || !inq) return;
  if (!S.loaded) { cars.innerHTML = inq.innerHTML = `<div class="empty-state">Loading…</div>`; return; }
  cars.innerHTML = dnSpCarsPanel(); inq.innerHTML = dnSpInquiriesPanel();
  dnSpTabBadges();
  const post = document.getElementById("sp_postcar2"); if (post) post.addEventListener("click", dnStartSpotterAdd);
  cars.querySelectorAll("[data-spact]").forEach(b => b.addEventListener("click", () => dnSpCarAction(b)));
  cars.querySelectorAll("[data-spdeal]").forEach(b => b.addEventListener("click", () => dnSpSetDeal(b)));
  inq.querySelectorAll("[data-iqsave]").forEach(b => b.addEventListener("click", async () => {
    const id = b.getAttribute("data-iqsave");
    const status = inq.querySelector(`[data-iqstatus="${id}"]`).value, note = inq.querySelector(`[data-iqnote="${id}"]`).value.trim() || null;
    const { error } = await getSupabase().from("vehicle_inquiries").update({ status, dealer_note: note }).eq("id", id);
    if (error) { showToast("Couldn't save: " + error.message); return; }
    const q = S.received.find(x => x.id === id); if (q) { q.status = status; q.dealer_note = note; }
    showToast("Saved"); dnPaintSpotterPanels();
  }));
}
async function dnSpRefresh(msg) {
  await dnLoadSpotterCars(); state.cars.loaded = false;
  if (msg) showToast(msg);
  dnPaintSpotterPanels();
}
async function dnSpSetDeal(btn) {
  const id = btn.getAttribute("data-id"), deal = btn.getAttribute("data-spdeal"), c = state.spotterCars.cars.find(x => x.id === id);
  if (!c || (c.deal_status || "Available") === deal) return;
  if (deal === "Sold" && !confirm("Mark this car as sold? It stays visible with a SOLD marker for a few days, then disappears from the Cars page.")) return;
  const { error } = await getSupabase().rpc("owner_set_deal_status", { p_id: id, p_deal: deal });
  if (error) { showToast(error.message); return; }
  return dnSpRefresh(deal === "Available" ? "Marked as available" : deal === "Sold" ? "Marked as sold" : "Marked as pending deal");
}
async function dnSpCarAction(btn) {
  const act = btn.getAttribute("data-spact"), id = btn.getAttribute("data-id"), S = state.spotterCars, sb = getSupabase();
  if (act === "edit") { S.editId = id; dnPaintSpotterPanels(); return; }
  if (act === "canceledit") { S.editId = null; dnPaintSpotterPanels(); return; }
  if (act === "saveedit") {
    const v = id2 => (document.getElementById(id2) || {}).value;
    const price = Number(v("spe_price")), offerRaw = v("spe_offer"), offer = Number(offerRaw);
    if (!(price > 0) || offerRaw === "" || !(offer >= 0)) { showToast("Enter a valid price and commission."); return; }
    if (!String(v("spe_make") || "").trim() || !String(v("spe_model") || "").trim()) { showToast("Make and model can't be empty."); return; }
    if (String(v("spe_desc") || "").trim().length < 10) { showToast("Please describe the car (at least a sentence)."); return; }
    const p = { make: v("spe_make"), model: v("spe_model"), variant: v("spe_variant"), year: v("spe_year"), mileage: v("spe_mileage"), colour: v("spe_colour"),
      body_type: v("spe_body"), transmission: v("spe_trans"), fuel_type: v("spe_fuel"), province: v("spe_prov"), city: v("spe_city"),
      price: price, owner_offer: offer, owner_note: v("spe_note"), description: v("spe_desc"), features: v("spe_feat") };
    const { error } = await sb.rpc("owner_edit_private_car", { p_id: id, p });
    if (error) { showToast(error.message); return; }
    S.editId = null; return dnSpRefresh("Saved — AutoMarketer will see your changes.");
  }
  if (act === "remove") {
    if (!confirm("Remove this car for good?\n\nIts photos, messages and buyer inquiries are deleted and this cannot be undone.\n\nTo just hide it for now, use “Delist (hide)” instead.")) return;
    const { data, error } = await sb.rpc("owner_delete_private_car", { p_id: id });
    if (error) { showToast(error.message); return; }
    await dnRemoveFiles(data);
    return dnSpRefresh("Car removed");
  }
  if (act === "accept") {
    if (!confirm("Accept AutoMarketer's counter-offer and split?")) return;
    const { error } = await sb.rpc("owner_accept_counter", { p_id: id });
    if (error) { showToast(error.message); return; }
    return dnSpRefresh("Accepted — AutoMarketer will approve your car.");
  }
  if (act === "send") {
    const box = document.getElementById("spm_" + id), body = box ? box.value.trim() : "";
    if (!body) { showToast("Write a message first."); return; }
    const { error } = await sb.rpc("owner_send_message", { p_id: id, p_body: body });
    if (error) { showToast(error.message); return; }
    return dnSpRefresh("Message sent");
  }
  if (act === "withdraw") {
    if (!confirm("Delist this car? It is hidden from the Cars page. (To delete it for good, use “Remove car”.)")) return;
    const { error } = await sb.rpc("owner_withdraw_car", { p_id: id });
    if (error) { showToast(error.message); return; }
    return dnSpRefresh("Car delisted");
  }
}
function dnSpTab(tab) { state.spotterCars.tab = tab; dnSpApplyTab(); dnSyncHash(); }

  const on = (id, fn) => { const el = document.getElementById(id); if (el) el.addEventListener("click", fn); };

/* ---- delete the picture files that belonged to a removed car (the car itself is already gone) ---- */
async function dnRemoveFiles(paths) {
  if (!paths) return;
  const sb = getSupabase();
  for (const [bucket, key] of [["vehicle-photos", "photos"], ["vehicle-originals", "originals"], ["vehicle-docs", "docs"]]) {
    const list = (paths[key] || []).filter(Boolean);
    if (!list.length) continue;
    try { await sb.storage.from(bucket).remove(list); } catch (e) { console.warn("file clean-up", bucket, e); }
  }
}

async function dnEnsureSellerUid() {
  const sb = getSupabase();
  const { data: { session } } = await sb.auth.getSession();
  if (session && session.user && session.user.is_anonymous) return session.user.id;
  if (session) await sb.auth.signOut();                       // some other leftover sign-in: replace it with a guest one
  const { data, error } = await sb.auth.signInAnonymously();
  if (error || !data || !data.user) throw (error || new Error("Could not start"));
  return data.user.id;
}
async function dnStartSellerAdd() {
  const S = state.seller; if (S.busy) return;
  if (state.spotterAuth.session || state.dealer.session || state.admin.authed) {
    showToast(state.spotterAuth.session ? "You're logged in as a Spotter — use “Post a car” in your dashboard." : "Log out first, then use this page as a seller.");
    return;
  }
  S.busy = true; S.error = ""; render();
  try {
    S.uid = await dnEnsureSellerUid();
    state.dealerAdd = { kind: "seller", step: 0, id: dnNewId(), shots: {}, disc: null, submitting: false, error: "", progress: "", showMissing: false };
    state.data = {};
    state.screen = "seller-add"; try { dnWarmBg(); } catch (_) {}
  } catch (e) {
    console.warn("seller sign-in failed", e); S.uid = null;
    S.error = "We couldn't start the form just now. Please try again in a minute, or message us on WhatsApp and we'll take your car details there." +
      (/anonymous|disabled|not allowed/i.test(String(e && e.message)) ? " (Staff: in Supabase turn ON Authentication → Sign In / Providers → “Allow anonymous sign-ins”.)" : "");
  }
  S.busy = false; render();
}

/* ==========================================================================
   DEALERS NETWORK — public dealership directory + profile pages, and the dealer's "edit my public profile" form.
   Buyers see: name, town, logo, cover, about, brands, hours, website/social links, cars.
   Buyers NEVER see: phone numbers, e-mail, contact person, commissions, registration number.
   ========================================================================== */
state.dealerDir = { loaded: false, loading: false, list: [], error: "", q: "", prov: "" };
state.dealerProf = { slug: "", data: null, cars: [], status: "idle" };

async function dnLoadDealerDir(force) {
  const D = state.dealerDir;
  if (D.loading || (D.loaded && !force)) return;
  D.loading = true;
  const { data, error } = await getSupabase().rpc("get_public_dealers");
  D.loading = false;
  if (error) { console.warn("dealer directory", error); D.error = "Dealerships couldn't be loaded right now. Please try again shortly."; D.list = []; }
  else { D.list = data || []; D.error = ""; }
  D.loaded = true;
}
function dnDealerSlugFor(c) {
  if (!c || c.seller_type !== "dealer" || !c.dealer_id) return "";
  const d = state.dealerDir.list.find(x => x.id === c.dealer_id); return d ? d.slug : "";
}
function dnSellerLink(c) {
  const slug = dnDealerSlugFor(c);
  return slug ? `<a href="#dealer/${escapeHtml(slug)}" data-dealerlink="${escapeHtml(slug)}">${escapeHtml(dnSeller(c))}</a>` : escapeHtml(dnSeller(c));
}
function dnOpenDealer(slug) {
  state.dealerProf = { slug: String(slug).toLowerCase(), data: null, cars: [], status: "loading" };
  state.screen = "dealer-profile"; render(); window.scrollTo(0, 0);
}
document.addEventListener("click", (e) => {
  const a = e.target.closest && e.target.closest("[data-dealerlink]");
  if (a) { e.preventDefault(); dnOpenDealer(a.getAttribute("data-dealerlink")); }

const dnInitials = (n) => String(n || "?").split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join("");

function dnPaintDealerDir() {

  el.innerHTML = D.error ? `<div class="empty-state" style="grid-column:1/-1;">${escapeHtml(D.error)}</div>`

function dnLinkRow(label, url) {

async function bindDealerProfile() {
  bindNav(); bindFooterLinks();
  const P = state.dealerProf;
  const wire = () => {
    document.querySelectorAll("[data-opencar]").forEach(card => card.addEventListener("click", () => dnOpenCar(card.getAttribute("data-opencar"))));
    document.querySelectorAll('[data-dp="back"]').forEach(a => a.addEventListener("click", (e) => { e.preventDefault(); state.screen = "dealerships"; render(); }));
  };
  if (P.status !== "loading") { wire(); return; }
  const sb = getSupabase();
  const { data, error } = await sb.rpc("get_public_dealer", { p_slug: P.slug });
  if (state.screen !== "dealer-profile" || state.dealerProf !== P) return;        // the visitor moved on meanwhile
  P.data = !error && data && data[0] ? data[0] : null;
  if (P.data) {
    const r = await sb.from("vehicles").select(DN_CAR_COLS).eq("dealer_id", P.data.id).eq("status", "Approved").order("created_at", { ascending: false }).limit(200);
    P.cars = r.data || [];
    if (!state.dealerDir.list.find(x => x.id === P.data.id)) state.dealerDir.list.push(P.data);
    const C = state.cars; P.cars.forEach(c => { if (!C.list.find(x => x.id === c.id)) C.list.push(c); });
    document.title = P.data.name + " — AutoMarketer Dealers Network";
  }
  P.status = "done"; render();
}

function dnBindPubPanel(root) {
  const D = state.dealer, P = D.pub || (D.pub = {}), sb = getSupabase();

      showToast("Picture added — press “Save public page”");
    } catch (e) { console.warn(e); showToast("That picture couldn't be read. Try a JPG or PNG."); }
  }));

    if (urlBad) { showToast("The " + urlBad + " link must start with https://"); return; }
    save.disabled = true;
    const { data, error } = await sb.rpc("dealer_save_profile", { p: { tagline: P.tagline, about: P.about, brands: P.brands, hours: P.hours, website: P.website, facebook: P.facebook, instagram: P.instagram, show_address: !!P.show_address, logo_path: P.logo_path || "", cover_path: P.cover_path || "" } });

   CARS NETWORK  —  part 4: AutoMarketer staff screens (Cars / Inquiries / Dealers)
   Cars tab: private cars posted by Spotters (VIN + disc check, commission offer, counter-offer, split, messages)
             and — once the Dealers Network opens — dealership cars.

async function loadAdminDN() {
  const sb = getSupabase(), A = state.adminDN;
  const [dl, cr, dt, st, iq, ot, docs, msgs, sps, sel] = await Promise.all([
    sb.from("dealers").select("*").order("created_at", { ascending: false }),
    sb.from("vehicles").select("*").order("created_at", { ascending: false }).limit(1000),
    sb.from("vehicle_dealer_terms").select("*"),
    sb.from("vehicle_spotter_terms").select("*"),
    sb.from("vehicle_inquiries").select("*, vehicles(ref,make,model,variant,year,dealer_name,seller_type,owner_kind)").order("created_at", { ascending: false }).limit(1000),
    sb.from("vehicle_owner_terms").select("*"),
    sb.from("vehicle_private_docs").select("*"),
    sb.from("vehicle_messages").select("*").order("created_at", { ascending: true }),
    sb.from("spotter_accounts").select("id,full_name,whatsapp,email,verification_status"),
    sb.from("vehicle_seller_contacts").select("*")
  ]);
  A.loadError = [["dealers", dl], ["cars", cr], ["inquiries", iq], ["commission offers", ot], ["VIN/disc records", docs], ["messages", msgs], ["Spotters", sps], ["seller details", sel]].filter(([, r]) => r.error).map(([n, r]) => n + ": " + r.error.message).join(" · ");
  A.dealers = dl.data || []; A.cars = cr.data || []; A.inquiries = iq.data || [];
  A.dealerTerms = {}; (dt.data || []).forEach(t => { A.dealerTerms[t.vehicle_id] = Number(t.dealer_commission); });
  A.spotterTerms = {}; (st.data || []).forEach(t => { A.spotterTerms[t.vehicle_id] = Number(t.spotter_commission); });
  A.ownerTerms = {}; (ot.data || []).forEach(t => { A.ownerTerms[t.vehicle_id] = t; });
  A.docs = {}; (docs.data || []).forEach(d => { A.docs[d.vehicle_id] = d; });
  A.msgs = {}; (msgs.data || []).forEach(m => { (A.msgs[m.vehicle_id] = A.msgs[m.vehicle_id] || []).push(m); });
  A.spotters = {}; (sps.data || []).forEach(sp => { A.spotters[sp.id] = sp; });
  A.sellers = {}; (sel.data || []).forEach(x => { A.sellers[x.vehicle_id] = x; });
  A.loaded = true;
}
