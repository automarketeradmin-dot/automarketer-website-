async function adminPrivateAction(id, action) {
  const A = state.adminDN, sb = getSupabase(), c = A.cars.find(x => x.id === id), o = A.ownerTerms[id] || {};
  const num = (pre) => { const v = (document.getElementById(pre + id) || {}).value; return v === undefined || String(v).trim() === "" ? null : Number(v); };
  const text = (pre) => ((document.getElementById(pre + id) || {}).value || "").trim();
  if (!c) return;
  if (action === "chat") {
    const body = text("cm_"); if (!body) { showToast("Write a message first."); return; }
    const { error } = await sb.from("vehicle_messages").insert({ vehicle_id: id, sender: "admin", body });
    if (error) { showToast("Couldn't send: " + error.message); return; }
    await loadAdminDN(); showToast("Message sent"); paintAdminCars(); return;
  }
  if (c.owner_kind === "seller") return adminSellerAction(id, action);
  const ps = num("ps_"), am = num("as_"), fs = num("fs_"), msg = text("am_"), reason = text("rs_");
  if ([ps, am, fs].some(x => x !== null && !(x >= 0))) { showToast("Amounts can't be negative."); return; }
  let status = c.status, cstat = o.commission_status || "Proposed", okMsg = "Saved";
  if (action === "approve") {
    if (fs === null && A.spotterTerms[id] === undefined) { showToast("Enter what the Spotter who brings the buyer gets."); return; }
    status = "Approved"; cstat = "Approved"; okMsg = c.status === "Approved" ? "Split saved" : "Approved — the car is now live";
  } else if (action === "counter") {
    if (!msg) { showToast("Write a message to the seller with your counter-offer."); return; }
    if (ps === null && am === null && fs === null && !confirm("No split entered. Send the message only?")) return;
    cstat = "Counter-offer"; if (status === "Declined") status = "Pending"; okMsg = "Counter-offer sent to the seller";
  } else if (action === "reject") {
    if (!msg) { showToast("Tell the seller why the commission can't work."); return; }
    cstat = "Rejected"; okMsg = "Commission rejected — the seller was told";
  } else if (action === "decline") {
    if (!reason && !confirm("No reason entered. Decline anyway?")) return;
    status = "Declined"; okMsg = "Car declined";
  } else if (action === "pending") { status = "Pending"; okMsg = "Moved back to Pending"; }
  const { error } = await sb.rpc("admin_review_private_car", {
    p_id: id, p_status: status, p_reason: action === "decline" ? (reason || null) : null, p_commission_status: cstat,
    p_admin_message: msg || null, p_poster_share: ps, p_am_share: am, p_finder_share: fs
  });
  if (error) { showToast("Couldn't update: " + error.message); return; }
  showToast(okMsg); await loadAdminDN(); render();
}
async function adminSellerAction(id, action) {
  const A = state.adminDN, sb = getSupabase(), c = A.cars.find(x => x.id === id), o = A.ownerTerms[id] || {}, sc = (A.sellers || {})[id] || {};
  const num = (pre) => { const v = (document.getElementById(pre + id) || {}).value; return v === undefined || String(v).trim() === "" ? null : Number(v); };
  const reason = ((document.getElementById("rs_" + id) || {}).value || "").trim();
  const comm = num("sc_"), fs = num("fs_"), ask = Number(sc.asking_price || 0);
  if ([comm, fs].some(x => x !== null && !(x >= 0))) { showToast("Amounts can't be negative."); return; }
  let status = c.status, okMsg = "Saved";
  if (action === "approve") {
    if (comm === null) { showToast("Enter your commission on top of the asking price (0 if none)."); return; }
    if (fs === null && A.spotterTerms[id] === undefined) { showToast("Enter what the Spotter who brings the buyer gets."); return; }
    status = "Approved"; okMsg = c.status === "Approved" ? "Price saved" : "Approved — the car is now live at " + money(ask + comm);
  } else if (action === "decline") {
    if (!reason && !confirm("No reason entered. Decline anyway?")) return;
    status = "Declined"; okMsg = "Car declined";
  } else if (action === "pending") { status = "Pending"; okMsg = "Moved back to Pending"; }
  if (comm !== null && comm !== (sc.commission == null ? null : Number(sc.commission))) {
    const r = await sb.rpc("admin_set_seller_price", { p_id: id, p_commission: comm });
    if (r.error) { showToast("Couldn't save the price: " + r.error.message); return; }
  }
  const { error } = await sb.rpc("admin_review_private_car", {
    p_id: id, p_status: status, p_reason: action === "decline" ? (reason || null) : null,
    p_commission_status: status === "Approved" ? "Approved" : (o.commission_status || "Proposed"),
    p_admin_message: null, p_poster_share: ask, p_am_share: comm, p_finder_share: fs
  });
  if (error) { showToast("Couldn't update: " + error.message); return; }
  showToast(okMsg); await loadAdminDN(); render();
}

async function tcSign(paths) {
  const T = tcS(), now = Date.now();
  const need = Array.from(new Set((paths || []).filter(Boolean))).filter(p => !T.urls[p] || now - T.urls[p].t > 50 * 60 * 1000);
  if (!need.length) return;
  try {
    const { data, error } = await getSupabase().storage.from("tc-photos").createSignedUrls(need, 3600);
    if (!error && data) data.forEach(x => { if (x.signedUrl && x.path) T.urls[x.path] = { u: x.signedUrl, t: now }; });
  } catch (e) { console.warn("signed urls", e); }
}

async function tcRegister(kind, d) {
  const sb = getSupabase(), email = d.email.trim().toLowerCase();
  let user = null;
  const { data: su, error: suErr } = await sb.auth.signUp({ email, password: d.password });
  if (suErr) {
    if (!/already/i.test(suErr.message)) return { ok: false, error: suErr.message };
    const { data: si, error: siErr } = await sb.auth.signInWithPassword({ email, password: d.password });
    if (siErr) return { ok: false, error: "An account with this email already exists. Please log in instead." };
    const { data: existing } = await sb.from("tc_companies").select("id").maybeSingle();
    if (existing) return { ok: false, error: "This email is already registered. Please log in." };
    user = si.user;
  } else {
    if (!su.session) return { ok: false, error: "Account created — please check your email to confirm it, then log in." };
    user = su.user;
  }
  const { data: row, error } = await sb.from("tc_companies").insert({
    id: user.id, kind, company_name: d.companyName.trim(), contact_person: d.contactPerson.trim(), phone: d.phone.trim(), email,
    province: d.province, city: d.city.trim(), address: (d.address || "").trim() || null, reg_number: (d.regNumber || "").trim() || null,
    agreement_accepted: true, agreement_version: TC.AGREEMENT_VERSION, agreement_accepted_at: new Date().toISOString()
  }).select().single();
  if (error) return { ok: false, error: "Couldn't save your company: " + error.message };
  return { ok: true, account: row };
}
async function tcLogin(email, password) {
  const sb = getSupabase();
  const { error } = await sb.auth.signInWithPassword({ email: email.trim().toLowerCase(), password });
  if (error) return { ok: false, error: "Incorrect email or password." };
  const { data: row } = await sb.from("tc_companies").select("*").maybeSingle();
  if (!row) { await sb.auth.signOut(); return { ok: false, error: "That login isn't a truck or contract company account. Spotters and dealers log in on their own pages." }; }
  return { ok: true, account: row };
}

async function tcLoad() {
  const T = tcS(), sb = getSupabase(), s = T.session, mineTable = s.kind === "truck" ? "tc_trucks" : "tc_contracts";
  const [me, mine, req, prof, can] = await Promise.all([

    sb.from("tc_requests").select("*").order("created_at", { ascending: false }),

  T.mine = mine.data || []; T.requests = req.data || []; T.pub = prof.data ? Object.assign({}, prof.data) : (T.pub || {});

async function tcLoadBrowse(force) {

  if (T.browseLoaded && !force) return;
  const sb = getSupabase(), other = s.kind === "truck" ? "contract" : "truck";

}

function bindTcAuth() {
  bindNav(); bindFooterLinks();
  const T = tcS();
  const back = document.querySelector('[data-role="tc_back"]'); if (back) back.addEventListener("click", () => { state.screen = "tc-home"; render(); });
  attachFieldListeners(document.querySelector(".screen"), () => render());
  document.querySelectorAll('[data-role="switchview"]').forEach(a => a.addEventListener("click", (e) => { e.preventDefault(); state.data = {}; T.error = ""; T.view = T.view === "login" ? "register" : "login"; render(); }));
  document.querySelectorAll('[data-role="switchkind"]').forEach(a => a.addEventListener("click", (e) => { e.preventDefault(); state.data = {}; T.error = ""; T.kind = T.kind === "truck" ? "contract" : "truck"; render(); }));

    const isLogin = T.view === "login";
    const fields = isLogin ? TC_LOGIN_FIELDS : tcRegFields(T.kind).concat([TC_AGREE_FIELD]);
    readVisibleFieldsIntoState(fields);
    if (!validateStep(fields)) return;
    const label = isLogin ? "Log in" : "Create company account";
    const fail = (m) => { T.error = m; btn.disabled = false; btn.textContent = label; render(); };
    btn.disabled = true; btn.textContent = "Please wait…";

function tcReadForm() {

function tcBindForm(el) {
  const T = tcS(), D = T.draft, k = T.session.kind, sb = getSupabase();
  const err = (m) => { const e = document.getElementById("tc_formerr"); e.textContent = m; e.style.display = m ? "block" : "none"; };
  const inp = el.querySelector("[data-tcphoto]");
  if (inp) inp.addEventListener("change", async () => {
    tcReadForm();
    const files = Array.from(inp.files || []).slice(0, 4 - D.photos.length);
    if (!files.length) return;
    showToast("Uploading…");
    for (const f of files) {
      try { const up = await tcUpload(f, "listings", 1600); D.photos.push({ path: up.path, url: URL.createObjectURL(up.blob), fresh: true }); }
      catch (e) { console.warn(e); showToast("A picture couldn't be uploaded: " + (e.message || "try a JPG or PNG")); }
    }
    tcPaintBody();
  });
  el.querySelectorAll("[data-tcrmphoto]").forEach(b => b.addEventListener("click", () => {

    D.photos.splice(i, 1); tcPaintBody();
  }));
  document.getElementById("tc_cancel").addEventListener("click", () => {

    for (const [id, label, type] of spec) if ((type === "text" || type === "textarea") && tcHasContact(v[id])) return err(`“${label}” looks like it contains a phone number or e-mail address. Please remove it — AutoMarketer passes your details on after a match.`);
    if (v.year && !(Number(v.year) >= 1950 && Number(v.year) <= 2100)) return err("Please enter a valid year.");
    for (const n of ["payload_tons", "min_payload"]) if (v[n] && !(Number(v[n]) > 0 && Number(v[n]) <= 200)) return err("Please enter a payload in tons (more than 0, up to 200).");

  });
}

function tcBindMine(el) {

  const T = tcS(), s = T.session, k = s.kind, other = k === "truck" ? "contract" : "truck";
  if (s.status !== "Approved") return `<div class="panel tc-locked"><div class="tc-lock">${svcIcon('<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>')}</div><div><h4 style="margin:0 0 4px;">${other === "truck" ? "Trucks" : "Contracts"} open once you are approved</h4><p class="help" style="margin:0;">AutoMarketer checks every company first. As soon as your account is approved you can browse ${other}s and company profiles here.</p></div></div>`;
  if (!T.browseLoaded) return `<div class="empty-state">Loading…</div>`;
  if (T.browseErr) return `<div class="err">Couldn’t load right now: ${escapeHtml(T.browseErr)}</div>`;
  const q = T.q.trim().toLowerCase();
  const provs = Array.from(new Set(T.browse.map(x => x.company_province).concat(T.dir.map(d => d.province)).filter(Boolean))).sort();
  const filt = (txt, prov) => (!q || txt.toLowerCase().includes(q)) && (!T.prov || prov === T.prov);
  const items = T.browse.filter(x => filt([tcTitle(other, x), x.company_name, x.company_city, x.regions, x.location, x.description, x.work_type, x.truck_type, x.requirements].filter(Boolean).join(" "), x.company_province));
  const comps = T.dir.filter(d => filt([d.name, d.city, d.tagline, d.focus, d.areas].filter(Boolean).join(" "), d.province));
  const asked = new Set(T.requests.filter(r => r.status === "New" || r.status === "In touch").map(r => r.target_id));
  return `<div class="tc-toolbar">
      <div class="seg"><button class="${T.sub === "listings" ? "on" : ""}" data-tcsub="listings">${other === "truck" ? "Trucks" : "Contracts"} <span>${items.length}</span></button><button class="${T.sub === "companies" ? "on" : ""}" data-tcsub="companies">Companies <span>${comps.length}</span></button></div>
      <input class="ctrl" id="tc_q" type="search" placeholder="Search…" value="${escapeHtml(T.q)}">
      <select class="ctrl" id="tc_prov"><option value="">All provinces</option>${provs.map(p => `<option ${T.prov === p ? "selected" : ""}>${escapeHtml(p)}</option>`).join("")}</select>
    </div>
    ${T.sub === "listings"
      ? `<div class="tc-cards">${items.map(x => tcFindCard(other, x, asked.has(x.id))).join("") || `<div class="empty-state" style="grid-column:1/-1;">${T.browse.length ? "Nothing matches that." : `No ${other}s are listed yet — check back soon.`}</div>`}</div>`
      : `<div class="dealer-grid">${comps.map(tcCompanyCard).join("") || `<div class="empty-state" style="grid-column:1/-1;">${T.dir.length ? "No companies match that." : "No companies are listed yet — check back soon."}</div>`}</div>`}`;
}

function tcOpenCompany(slug, kind) {

}
function tcBindAskAndLinks(root) {
  root.querySelectorAll("[data-tccompany]").forEach(a => a.addEventListener("click", (e) => { e.preventDefault(); tcOpenCompany(a.getAttribute("data-tccompany")); }));
  root.querySelectorAll("[data-tcask]").forEach(b => b.addEventListener("click", () => {
    const id = b.getAttribute("data-tcask"), T = tcS();
    T.openAsk = T.openAsk === id ? null : id;
    root.querySelectorAll("[data-askpanel]").forEach(p => { p.hidden = p.getAttribute("data-askpanel") !== T.openAsk; });
  }));
  root.querySelectorAll("[data-asksend]").forEach(b => b.addEventListener("click", async () => {
    const id = b.getAttribute("data-asksend"), kind = b.getAttribute("data-askkind"), T = tcS();
    const msg = (root.querySelector(`[data-askmsg="${id}"]`) || {}).value || "";
    b.disabled = true;
    const { error } = await getSupabase().rpc("tc_send_interest", { p_kind: kind, p_id: id, p_message: msg });
    b.disabled = false;
    if (error) { showToast(error.message); return; }
    T.openAsk = null; showToast("Sent — AutoMarketer will be in touch.");
    const r = await getSupabase().from("tc_requests").select("*").order("created_at", { ascending: false }); T.requests = r.data || T.requests;
    if (state.screen === "tc-company") render(); else tcPaintBody();

}
function tcBindFind(el) {
  const T = tcS();
  el.querySelectorAll("[data-tcsub]").forEach(b => b.addEventListener("click", () => { T.sub = b.getAttribute("data-tcsub"); tcPaintBody(); }));
  const q = el.querySelector("#tc_q"), p = el.querySelector("#tc_prov");
  if (q) q.addEventListener("input", () => { T.q = q.value; const pos = q.selectionStart; tcPaintBody(); const n = document.getElementById("tc_q"); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) {} } });
  if (p) p.addEventListener("change", () => { T.prov = p.value; tcPaintBody(); });
  tcBindAskAndLinks(el);
}

function tcProfileHtml() {
  const T = tcS(), s = T.session, K = TC_KIND[s.kind], P = T.pub || (T.pub = {}), live = s.status === "Approved";

      </div></div>
    <div class="panel"><h4>Private details</h4><p class="help" style="margin:0 0 10px;">Only AutoMarketer sees these. Your login email can’t be changed here.</p>

}
function tcBindProfile(el) {
  const T = tcS(), P = T.pub, sb = getSupabase();
  attachFieldListeners(el.querySelector("#tc_private"), () => { readVisibleFieldsIntoState(TC_PRIVATE_FIELDS); tcPaintBody(); });
  el.querySelectorAll("[data-tcpub]").forEach(i => i.addEventListener("input", () => { P[i.getAttribute("data-tcpub")] = i.value; }));
  el.querySelectorAll("[data-tcpubimg]").forEach(inp => inp.addEventListener("change", async () => {
    const f = inp.files && inp.files[0]; if (!f) return;
    const kind = inp.getAttribute("data-tcpubimg");
    try {
      const up = await tcUpload(f, "profile", kind === "logo" ? 600 : 1800);
      P[kind + "_path"] = up.path; T.urls[up.path] = { u: URL.createObjectURL(up.blob), t: Date.now() };
      const prev = inp.parentElement.querySelector(".pub-prev"); prev.style.backgroundImage = `url('${T.urls[up.path].u}')`; prev.innerHTML = "";
      showToast("Picture added — press “Save public profile”");
    } catch (e) { console.warn(e); showToast("That picture couldn't be uploaded: " + (e.message || "try a JPG or PNG")); }
  }));
  const save = el.querySelector("#tc_savepub");
  save.addEventListener("click", async () => {
    const err = el.querySelector("#tc_puberr"); err.style.display = "none";
    for (const k of ["tagline", "about", "focus", "areas", "fleet"]) if (tcHasContact(P[k])) { err.textContent = "Please remove phone numbers and e-mail addresses from your public profile — AutoMarketer passes your details on after a match."; err.style.display = "block"; return; }
    if ((P.website || "").trim() && !/^https?:\/\/\S+$/i.test(P.website.trim())) { err.textContent = "The website must start with https://"; err.style.display = "block"; return; }
    save.disabled = true;
    const { data, error } = await sb.rpc("tc_save_profile", { p: { tagline: P.tagline, about: P.about, focus: P.focus, areas: P.areas, fleet: P.fleet, website: P.website, logo_path: P.logo_path || "", cover_path: P.cover_path || "" } });
    save.disabled = false;
    if (error) { err.textContent = error.message; err.style.display = "block"; return; }
    P.slug = data; showToast("Public profile saved"); tcPaintBody();
  });
  const view = el.querySelector("#tc_viewpub"); if (view) view.addEventListener("click", () => tcOpenCompany(P.slug, T.session.kind));
  el.querySelector("#tc_saveprivate").addEventListener("click", async () => {
    readVisibleFieldsIntoState(TC_PRIVATE_FIELDS);
    if (!validateStep(TC_PRIVATE_FIELDS)) return;
    const d = state.data;
    const { error } = await sb.from("tc_companies").update({ company_name: d.companyName.trim(), contact_person: d.contactPerson.trim(), phone: d.phone.trim(), province: d.province, city: d.city.trim(), address: (d.address || "").trim() || null, reg_number: (d.regNumber || "").trim() || null }).eq("id", T.session.id);
    if (error) return showToast("Couldn't save: " + error.message);
    await tcLoad(); showToast("Private details saved"); render();
  });
}

async function bindTcCompany() {

/* ------------------------------ ADMIN: Trucks tab ------------------------------ */
function tcAdminS() { if (!state.tcAdmin) state.tcAdmin = { loaded: false, sub: "companies", companies: [], trucks: [], contracts: [], requests: [], err: "", filter: "" }; return state.tcAdmin; }
async function tcLoadAdmin() {
  const A = tcAdminS(), sb = getSupabase();
  const [c, t, k, r, st] = await Promise.all([
    sb.from("tc_companies").select("*").order("created_at", { ascending: false }),
    sb.from("tc_trucks").select("*").order("created_at", { ascending: false }).limit(1000),
    sb.from("tc_contracts").select("*").order("created_at", { ascending: false }).limit(1000),
    sb.from("tc_requests").select("*").order("created_at", { ascending: false }).limit(1000),
    sb.from("tc_settings").select("*")
  ]);
  A.truckSee = !!((st.data || []).find(x => x.key === "truck_owners_see_contracts") || {}).value;
  A.err = [["companies", c], ["trucks", t], ["contracts", k], ["requests", r]].filter(([, x]) => x.error).map(([n, x]) => n + ": " + x.error.message).join(" · ");
  A.companies = c.data || []; A.trucks = t.data || []; A.contracts = k.data || []; A.requests = r.data || [];
  A.loaded = true;
  const T = tcS(); await tcSign(A.trucks.flatMap(x => x.photos || []));
}
function tcAdminBadge() {
  const A = state.tcAdmin; if (!A || !A.loaded) return "";
  const n = A.companies.filter(c => c.status === "Pending").length + A.trucks.filter(x => x.status === "Pending").length + A.contracts.filter(x => x.status === "Pending").length + A.requests.filter(x => x.status === "New").length;
  return n ? ` <span style="opacity:.8;">(${n})</span>` : "";
}
async function tcBindAdminTab() {
  const el = document.getElementById("ad_dn"); if (!el) return;

function tcPaintAdmin() {
  const el = document.getElementById("ad_dn"); if (!el) return;

function navDrop(id, label, items) {
  const open = state.nav.drop === id;
  return `<div class="nav-dropdown ${open ? "open" : ""}">
    <button type="button" class="nav-dropdown-btn" data-role="navdrop" data-drop="${id}" aria-expanded="${open}">${label}<svg viewBox="0 0 12 12" width="10" height="10" aria-hidden="true"><path d="M2 4.2l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <div class="nav-dropdown-menu">${items.map(([attr, t, d, badge]) => `<a href="#" ${attr}><b>${t}${badge ? ` <span class="badge new" style="margin-left:4px;">${badge}</span>` : ""}</b><span>${d}</span></a>`).join("")}</div>
  </div>`;
}
function renderNav() {
  const portals = [];
  if (state.tc && state.tc.session) portals.push([`data-navgo="tc-portal"`, state.tc.session.kind === "truck" ? "Truck portal" : "Contract portal"]);
  if (state.spotterAuth.session) portals.push([`data-navgo="spotter-dashboard"`, "My dashboard"]);
  if (DN.DEALERS_LIVE && state.dealer.session) portals.push([`data-navgo="dealer-portal"`, "Dealer portal"]);
  if (state.admin.authed) portals.push([`data-navgo="admin"`, "Admin"]);
  return `<nav class="site-nav">
    <div class="nav-row wide-wrap">
      <a href="#" class="nav-logo" data-navgo="landing" aria-label="AutoMarketer home">${renderLogo("sm")}</a>
      <button type="button" class="nav-burger" data-role="navburger" aria-label="Menu" aria-expanded="${state.nav.mobileOpen}">${state.nav.mobileOpen ? "✕" : "☰"}</button>
      <div class="nav-links ${state.nav.mobileOpen ? "open" : ""}">
        <a href="#" class="nav-home" data-navgo="landing">Home</a>
        <a href="#" class="nav-cars" data-navgo="cars">Cars<span class="nav-sub">Browse vehicles that are available</span></a>
        ${navDrop("services", "Buy &amp; sell", [
          [`data-navstart="buy"`, "Buy a vehicle", "Tell us what you need"],
          [`data-navstart="sell"`, "Sell a vehicle", "We find you the right buyer"],
          [`data-navstart="other"`, "Other services", "Everything else we can help with"],
          [`data-navstart="insurance"`, "Insurance", "Cover for vehicle owners", "Soon"]
        ])}
        ${navDrop("networks", "Networks", [
          [`data-navgo="spotters"`, "Spotters Network", "Earn by introducing buyers and cars"],
          [`data-navgo="dealers"`, "Dealers Network", "For dealerships: list your stock"],
          [`data-navgo="dealerships"`, "Find a dealership", "Browse dealership profiles"],
          [`data-navgo="tc-home"`, "Trucks &amp; Contracts", "Truck owners and contract holders"]
        ])}
        <a href="#" data-navgo="dreamrides">Dream Rides</a>
        <a href="#" data-navgo="about">About</a>
        ${portals.map(([a, l]) => `<a href="#" class="nav-portal" ${a}>${l}</a>`).join("")}
        <a class="nav-cta" href="https://wa.me/${CONFIG.AUTOMARKETER_WHATSAPP_NUMBER}" target="_blank" rel="noopener">WhatsApp us</a>
      </div>
    </div>
  </nav>`;
}
function bindNav() {
  const closeAll = () => { state.nav.mobileOpen = false; state.nav.drop = null; };
  document.querySelectorAll("[data-navgo]").forEach(el => el.addEventListener("click", (e) => {
    e.preventDefault(); closeAll();
    state.screen = el.getAttribute("data-navgo"); render();
  }));
  document.querySelectorAll("[data-navstart]").forEach(el => el.addEventListener("click", (e) => {
    e.preventDefault(); closeAll();
    startFlow(el.getAttribute("data-navstart"));
  }));
  const burger = document.querySelector('[data-role="navburger"]');
  if (burger) burger.addEventListener("click", () => { state.nav.mobileOpen = !state.nav.mobileOpen; state.nav.drop = null; render(); });
  document.querySelectorAll('[data-role="navdrop"]').forEach(btn => btn.addEventListener("click", (e) => {
    e.stopPropagation();
    const id = btn.getAttribute("data-drop"); state.nav.drop = state.nav.drop === id ? null : id;
    document.querySelectorAll(".nav-dropdown").forEach(d => d.classList.toggle("open", d.querySelector("[data-drop]").getAttribute("data-drop") === state.nav.drop));
  }));
  if (!window.__navOutside) {
    window.__navOutside = true;
    document.addEventListener("click", (e) => {
      if (!state.nav.drop || e.target.closest(".nav-dropdown")) return;
      state.nav.drop = null; document.querySelectorAll(".nav-dropdown.open").forEach(d => d.classList.remove("open"));
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && state.nav.drop) { state.nav.drop = null; document.querySelectorAll(".nav-dropdown.open").forEach(d => d.classList.remove("open")); }
    });
  }
}

    if (kind === "start") startFlow(target); else { state.screen = target; render(); }
  };
  const click = document.getElementById("lp_click"); if (click) click.addEventListener("click", go);
  if (el) {
    const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
    let i = 0, n = 0, del = false;
    const tick = () => {
      if (!document.getElementById("lp_type")) { window.__lpT = null; return; }   // left the home page
      const full = LP_PHRASES[i].q; window.__lpIdx = i;
      if (reduce) { el.textContent = full; i = (i + 1) % LP_PHRASES.length; window.__lpT = setTimeout(tick, 2800); return; }
      if (!del) { n++; el.textContent = full.slice(0, n); if (n >= full.length) { del = true; window.__lpT = setTimeout(tick, 2100); return; } window.__lpT = setTimeout(tick, 48); }
      else { n -= 2; if (n <= 0) { n = 0; del = false; i = (i + 1) % LP_PHRASES.length; el.textContent = ""; window.__lpT = setTimeout(tick, 350); return; } el.textContent = full.slice(0, n); window.__lpT = setTimeout(tick, 22); }
    };
    tick();
  }
  bindNav();
  bindFooterLinks();
}

/* ==========================================================================
   DRAG & DROP PHOTOS (dealers, Spotters and private sellers share the same photo steps)
   - Drop one photo on a tile  -> it fills that tile.
   - Drop many photos on the big drop box (or tap it and pick several on a phone) -> they fill the empty tiles in order.
   - Drop the licence-disc photo on its tile.
   Everything goes through the same code as "Take or choose photo", so plate blurring, background removal,
   backdrop and the listing-strength ring behave exactly as before.
   ========================================================================== */
const DN_IMG_RX = /\.(jpe?g|png|webp|heic|heif|gif|bmp)$/i;
function dnIsImageFile(f) { return f && (/^image\//.test(f.type) || DN_IMG_RX.test(f.name || "")); }
async function dnDropFiles(fileList, firstSlot) {
  const A = state.dealerAdd; if (!A || !document.getElementById("dn_shots")) return;
  let files = Array.from(fileList || []);
  const bad = files.filter(f => !dnIsImageFile(f)).length;
  files = files.filter(dnIsImageFile);
  if (!files.length) { showToast("Please drop photo files (JPG or PNG)."); return; }
  const queue = [];
  if (firstSlot && dnSlot(firstSlot)) queue.push([firstSlot, files.shift()]);
  files.sort((a, b) => (a.name || "").localeCompare(b.name || "", undefined, { numeric: true }));   // IMG_001, IMG_002 ... stay in order
  const empties = dnAllSlots().filter(s => !A.shots[s.id] && s.id !== firstSlot);
  let skipped = 0;
  for (const f of files) { const s = empties.shift(); if (!s) { skipped++; continue; } queue.push([s.id, f]); }
  if (skipped) showToast(skipped + (skipped > 1 ? " photos" : " photo") + " didn't fit: every photo spot is full. Remove one to add another.");
  else if (bad) showToast(bad + (bad > 1 ? " files were" : " file was") + " not a photo and was skipped.");
  else if (queue.length > 1) showToast("Adding " + queue.length + " photos…");
  for (const [id, f] of queue) { if (!document.getElementById("dn_shots")) break; await dnHandleFile(id, f); }
}
(function dnInitDrop() {
  if (window.__dnDropInit) return; window.__dnDropInit = true;
  const hasFiles = (e) => e.dataTransfer && Array.from(e.dataTransfer.types || []).includes("Files");
  const onPhotoStep = () => !!(document.getElementById("dn_shots") || document.querySelector("[data-disc]"));
  const targetOf = (e) => (e.target && e.target.closest) ? e.target.closest("[data-shot],[data-disc],#dn_drop") : null;
  const clear = () => { document.querySelectorAll(".drop-over").forEach(x => x.classList.remove("drop-over")); document.body.classList.remove("dn-dragging"); };
  document.addEventListener("dragenter", (e) => { if (hasFiles(e) && onPhotoStep()) document.body.classList.add("dn-dragging"); });
  document.addEventListener("dragover", (e) => {
    if (!hasFiles(e)) return;
    e.preventDefault();                                   // also stops the browser opening a photo that is dropped in the wrong place
    const t = onPhotoStep() ? targetOf(e) : null;
    document.querySelectorAll(".drop-over").forEach(x => { if (x !== t) x.classList.remove("drop-over"); });
    if (t) { t.classList.add("drop-over"); e.dataTransfer.dropEffect = "copy"; } else e.dataTransfer.dropEffect = "none";
  });
  document.addEventListener("dragleave", (e) => { if (!e.relatedTarget) clear(); });
  document.addEventListener("drop", (e) => {
    if (!hasFiles(e)) return;
    e.preventDefault();
    const t = onPhotoStep() ? targetOf(e) : null; clear();
    if (!t) return;
    const files = Array.from(e.dataTransfer.files || []);
    if (t.hasAttribute("data-disc")) { const f = files.find(dnIsImageFile); if (f) dnHandleDisc(f); else showToast("Please drop a photo of the licence disc."); return; }
    dnDropFiles(files, t.getAttribute("data-shot"));
  });
  document.addEventListener("dragend", clear);
  document.addEventListener("change", (e) => {           // tap the drop box and choose several photos
    const inp = e.target; if (!inp || inp.id !== "dn_dropinput") return;
    const files = Array.from(inp.files || []); inp.value = "";
    dnDropFiles(files, null);
  });
})();

    link.href = LOGO_DATA_URI;

}
function showBootSplash() {
  const app = document.getElementById("app");
  app.innerHTML = `<div class="boot-splash">${renderLogo("lg")}<p class="boot-tagline">${escapeHtml(CONFIG.TAGLINE)}</p></div>`;
}
// Delegated, app-wide listeners — added once; work for any element on any
// screen without needing to be re-attached on every render().
document.addEventListener("click", (e) => {
  const pwBtn = e.target.closest("[data-pwtoggle]");
  if (pwBtn) {
    const input = document.getElementById(pwBtn.getAttribute("data-pwtoggle"));
    if (input) {
      const show = input.type === "password";
      input.type = show ? "text" : "password";
      pwBtn.textContent = show ? "Hide" : "Show";
    }
    return;
  }
  const copyEl = e.target.closest("[data-copylid]");
  if (copyEl) {
    const id = copyEl.getAttribute("data-copylid");
    (navigator.clipboard ? navigator.clipboard.writeText(id) : Promise.reject()).then(
      () => showToast("Copied " + id), () => showToast(id)
    );
  }
});

(async function boot() {
  try {
    const params = new URLSearchParams(window.location.search);
    const carRef = params.get("car");
    if (carRef && /^[A-Za-z0-9-]{3,30}$/.test(carRef)) { state.cars.openRef = carRef.toUpperCase(); state.screen = "car"; }
    const src = params.get("source");
    if (src) {
      const match = SOURCES_KNOWN.find(s => s.toLowerCase() === src.toLowerCase());
      state.source = match || src;
    }
  } catch (e) {}
  setFavicon();
  showBootSplash();
  try {
    const saved = await stGetPersonal("cookie_consent");
    if (saved) { state.cookie.decided = true; state.cookie.analytics = !!saved.analytics; }
  } catch (e) {}
  try { await restoreSession(); if (state.admin.authed) await loadAdminLeads(); } catch (e) { console.error("restoreSession", e); }
  try { dnApplyHash(); } catch (e) { console.error("route", e); }
  window.addEventListener("hashchange", dnOnHashChange);
  logEvent("visit", { source: state.source });
  setTimeout(render, 500);
})();
